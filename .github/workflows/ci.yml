# Continuous integration for lattice.
#
# Concerns gated:
#
# 1. **Correctness.** `cargo test --workspace` -- the full suite on
#    every push, across the cross-platform matrix (Linux / macOS /
#    Windows). Workspace currently runs ~1090+ tests in <1s.
# 2. **Lint hygiene.** `cargo clippy --workspace --tests`. The
#    workspace lints in `Cargo.toml` ([workspace.lints]) are the
#    authoritative gate: `unsafe_code` and `unused_must_use` are
#    `deny` (build-failing), `unwrap_used` / `panic` / `todo` are
#    `warn` (visible but not blocking). Newer clippy versions add
#    stylistic lints (`single_range_in_vec_init`, `manual_clamp`,
#    `assertions_on_constants`, ...) that are useful warnings but
#    shouldn't fail the build on a toolchain bump -- so we don't
#    pass `-D warnings`. The workspace's own `[workspace.lints]`
#    catches the hard rules.
#
#    NOTE: `actions-rust-lang/setup-rust-toolchain@v1` defaults
#    `rustflags: "-D warnings"`, which would override our
#    intentionally-relaxed gate by injecting `RUSTFLAGS=-D warnings`
#    workspace-wide. Every `setup-rust-toolchain` step below sets
#    `rustflags: ""` to disable that injection.
# 3. **Format.** `cargo fmt --check`. Strict gate -- the workspace
#    conforms to default rustfmt (no `rustfmt.toml` overrides), and
#    any drift fails CI.
# 4. **Docs.** `cargo doc --no-deps`. Builds the rustdoc output to
#    catch obvious breakage; rustdoc warnings stay warnings so a
#    toolchain bump that adds new lints doesn't fail the build.
# 5. **Benchmark surface.** `cargo bench --no-run` per crate that
#    has benches. Fast (compile-only) -- catches bench rot when
#    refactors break the criterion harness without anyone running
#    `cargo bench` locally.
# 6. **Bench baseline (main only).** Records criterion numbers as
#    a build artifact for future regression tooling to diff against.
# 7. **GPUI cross-platform build (5.7.A.1).** `cargo build -p
#    lattice-ui-gpui --features window` on Linux / macOS / Windows.
#    The `window` feature is opt-in (see `crates/lattice-ui-gpui/Cargo.toml`)
#    so the main `test` matrix above does not exercise it; this job
#    specifically validates that the GPUI peer renderer links against
#    its display-library deps on every supported platform. Linux
#    installs the X11 + Wayland + xkbcommon + fontconfig system libs
#    gpui's default features require; macOS + Windows have everything
#    they need pre-installed on GitHub-hosted runners. We don't run
#    the binary -- CI runners have no display server -- but compile +
#    link is the meaningful platform signal.
#
# What is NOT gated yet:
#
# - **Bench regression detection** (DESIGN.md §8.2: "CI fails on
#   >10% regression vs. main"). Shared-tenant runners (the
#   GitHub-hosted default) have ~20% bench variance; gating at 10%
#   on those is noise. Honest path: stand up a self-hosted runner
#   or adopt `bencher.dev` / `criterion-compare-action`, then
#   enable the gate.
# - **Alloc discipline check on the render hot path** (DESIGN.md
#   §8.2). A `dhat`-based test that runs the renderer N times and
#   asserts no allocations on steady-state frames is the spec; v1
#   tracks the discipline via code review and bench numbers
#   (snapshot_load is the canonical render-hot-path bench).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any prior in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          # PH7.5: the plugin host builds its wasm32-wasip2 fixture guests +
          # the `fuzzy-finder` validation plugin (via build.rs) for the
          # picker/adapter tests, the parity test, and the perf RATCHETS
          # (tests/perf_ratchet.rs — the CI gate on the §7 plugin budgets).
          # Without the target those all SKIP gracefully; installing it here
          # makes the gate actually run in CI.
          targets: wasm32-wasip2
          # Disable the action's default `RUSTFLAGS=-D warnings`
          # injection -- see the top-of-file note.
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace --locked
      - name: cargo clippy --workspace --tests
        # No `-D warnings` here -- the workspace `[workspace.lints]`
        # block is the authoritative gate. See the comment block
        # at the top of this file.
        run: cargo clippy --workspace --tests --locked

      - name: Send Status to Discord
        uses: appleboy/discord-action@v1.2.0
        if: always() # Sends notification regardless of success or failure
        with:
            webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
            message: |
              **Repository:** ${{ github.repository }}
              **Triggered By:** ${{ github.actor }}
              **Status:** ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}
              **Commit:**

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          rustflags: ""
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc --no-deps --workspace
        # Build the rustdoc output (catches obvious breakage --
        # invalid markdown that fails to render, etc.) but don't
        # promote rustdoc warnings to errors. Newer rustdoc
        # versions add new lints (broken intra-doc links it
        # couldn't catch before, doc-list-item indentation, ...)
        # that shouldn't fail a build on a toolchain bump.
        run: cargo doc --no-deps --workspace --locked

  bench-compile:
    name: bench-compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench --workspace --no-run
        # Compile every bench target to catch bench-code rot. Does
        # not execute the benches -- that's the bench-baseline job
        # below, gated on push-to-main only.
        run: cargo bench --workspace --no-run --locked

  bench-baseline:
    name: bench-baseline
    runs-on: ubuntu-latest
    # Record baselines only on main pushes -- PR runs would compete
    # with each other for shared-runner time and the numbers
    # wouldn't be useful for regression detection (variance dwarfs
    # signal). Once self-hosted runners or a stable bench harness
    # exist, this becomes a `bench-compare` job that fails on
    # regression.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench --workspace
        # Quick mode: small sample sizes, ~10x faster than full
        # criterion. Trades p99 fidelity for CI runtime; full runs
        # happen locally with `cargo bench` when a regression is
        # suspected.
        run: cargo bench --workspace --locked -- --quick
      - name: Upload criterion results
        uses: actions/upload-artifact@v4
        with:
          name: criterion-results
          path: target/criterion/
          retention-days: 30

  gpui-window-build:
    # Phase 5.7.A.1: validate the GPUI peer renderer (`lattice-ui-gpui`)
    # compiles + links against its display-library deps on every
    # supported platform. The `window` feature pulls real gpui 0.2.2;
    # the main `test` job above runs with `window` OFF (the scaffold's
    # lib + tests build everywhere). This job exists specifically to
    # catch platform-specific link breakage at PR time, not at release.
    name: gpui-window-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      # Linux: install X11 / Wayland / xkbcommon / fontconfig system
      # libs gpui's default features require at link time. macOS +
      # Windows have everything pre-installed on GitHub-hosted runners
      # (Metal SDK with Xcode CLI tools; DirectX + MSVC Build Tools).
      - name: Install Linux display libs
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libfontconfig1-dev
      - name: cargo build -p lattice-ui-gpui --features window
        # Build (not run) the placeholder window binary. The CI runner
        # has no display server, so executing the binary would hang or
        # fail with "no display"; compile + link is the meaningful
        # platform signal for this phase. Running the binary becomes a
        # follow-on slice once we add an xvfb-shaped harness or a
        # headless gpui mode.
        run: cargo build -p lattice-ui-gpui --features window --locked
