# Deploy the Lattice website (docs + landing page) to GitHub Pages.
#
# Builds the Zola site from site/, syncs docs from docs/user/, and
# deploys the output to the gh-pages branch. Triggered on:
#   - pushes to main touching site/ or docs/user/
#   - manual workflow_dispatch
name: deploy-docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/user/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Sync docs
        run: python3 site/scripts/sync-docs.sh

      - name: Build Zola site
        run: zola build
        working-directory: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
