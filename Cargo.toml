[workspace]
resolver = "2"
members = [
	"crates/lattice-ai",
	"crates/lattice-protocol",
	"crates/lattice-config-macros",
	"crates/lattice-mode",
	"crates/lattice-core",
	"crates/lattice-grammar",
	"crates/lattice-keymap",
	"crates/lattice-completion",
	"crates/lattice-picker",
	"crates/lattice-config",
	"crates/lattice-syntax",
	"crates/lattice-snippet",
	"crates/lattice-runtime",
	"crates/lattice-help",
	"crates/lattice-file-tree",
	"crates/lattice-oil",
	"crates/lattice-lsp",
	"crates/lattice-terminal",
	"crates/lattice-theme",
	"crates/lattice-dashboard",
	"crates/lattice-cells",
	"crates/lattice-multibuffer",
	"crates/lattice-compilation",
	"crates/lattice-host",
	"crates/lattice-ui-tui",
	"crates/lattice-ui-gpui",
	"crates/lattice-cli",
	"crates/lattice-diff",
	"crates/lattice-vcs",
	"crates/lattice-magit",
	"crates/lattice-agent",
	"crates/lattice-plugin-host",
	"crates/lattice-plugin-loader",
	"crates/lattice-plugin-manager",
	"crates/lattice-plugin-trace",
	"crates/lattice-plugin-api",
	"crates/lattice-plugin-sdk",
	"crates/lattice-plugin-sdk-derive",
	"xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/dhruvasagar/lattice"

[workspace.dependencies]
# Pure-Rust deflate. Already in the tree transitively (flate2, zstd);
# a direct edge adds no new distinct dependency. Used to compress the
# embedded user docs — see docs/dev/operations/embedded-docs-budget.md.
miniz_oxide = "0.8"
# Core
ropey = "1.6"
thiserror = "2.0"
anyhow = "1.0"

# Async (lattice-runtime + future Phase 4 LSP, Phase 7 plugin host)
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
futures = "0.3"
arc-swap = "1.7"

# SIMD-optimized substring search (lattice-core::search). Already a
# transitive dep via tree-sitter; promoting it to direct gives us
# `memchr::memmem::find` for ~2GB/s scans on AVX2. Used inside the
# `regex` crate as well; we keep the direct dep for ad-hoc literal
# scans the regex engine doesn't drive.
memchr = "2.7"

# Regex engine for `/`, `?`, `n`, `N`, `:s`. `fancy-regex` is a
# hybrid: it routes patterns without backrefs/lookarounds through
# the `regex` crate's RE2-style engine (linear-time, SIMD literal
# prefilter); only patterns that genuinely need backtracking fall
# back to its own bounded NFA. Net: same speed as `regex` for the
# common case, full vim/emacs-class backref support when needed,
# and a configurable recursion limit guards against catastrophic
# backtracking that emacs/vim cannot prevent.
fancy-regex = "0.13"

# Reserved for future parallel paths (tree-sitter query batches,
# index rebuilds, file-glob walks). Tried for `lattice-core::search`
# in B-γ but reverted: memmem scans rare-prefix needles at ~30GB/s
# sequentially, so a 13MB rope walk fits inside rayon's spawn
# overhead. Keep the workspace dep documented but unused for now.
rayon = "1.10"

# Serialization (Phase 0 just uses serde for protocol type derives)
serde = { version = "1.0", features = ["derive"] }

# MessagePack for the guest-side plugin SDK (lattice-plugin-sdk): a plugin event's
# opaque payload is MessagePack the plugin owns (PH7.8b). Pure-Rust, wasm-friendly.
rmp-serde = "1.3"

# Static config file parsing (lattice-config::loader). Read-only at
# load time; we don't need toml_edit's round-trip preservation
# until the post-1.0 `:customize` view writes back.
toml = "0.8"

# Cross-platform config-dir resolution (XDG on Linux, Application
# Support on macOS, FOLDERID_RoamingAppData on Windows). Used by
# the loader to locate ~/.config/lattice/lattice.toml and friends.
dirs = "5"

# 4.4.l: cross-platform file-system watcher (inotify on Linux,
# FSEvents on macOS, ReadDirectoryChanges on Windows). Used by
# the LSP file-watcher service to back `workspace/didChangeWatchedFiles`
# fan-out -- servers register glob patterns dynamically via
# `client/registerCapability`; we forward matching fs events.
notify = "6"

# 4.4.l: glob-pattern matching for the file-watcher's
# registration set. `globset` compiles multiple patterns into
# one fast aho-corasick-backed matcher so the per-event match
# cost stays O(1) regardless of how many patterns are
# registered.
globset = "0.4"

# VCS.1 (magit Layer 1): pure-Rust git repository interaction.
# `lattice-vcs` wraps gix for read + write git operations
# (status, blobs, refs, index, commits, branches). This is the
# full crate, not individual gix-* sub-crates, because the data
# layer needs Repository, Object, Index, Reference, and working-
# tree status — each provided by different sub-crates we'd
# otherwise list individually. Feature-gated to default set
# (no `max-pure` / `max-performance` toggles — the simple
# defaults are fast enough for magit workloads).
gix = "0.86"

# 5.8.AF.5 Slice 2: `.gitignore` / `.ignore` aware matching for
# the LSP file-watcher's source-side filter. Built by ripgrep's
# author; same crate every mature editor's LSP integration
# (helix, zed, neovim, ...) uses for "don't watch the things the
# user already told us are noise." We use the
# `gitignore::GitignoreBuilder` API directly, not the walker.
ignore = "0.4"

# LSP (Phase 4 -- lattice-lsp). `lsp-types` models the LSP 3.17
# wire types; we hand-roll the JSON-RPC client + framing per
# DESIGN.md §5.4 (tower-lsp is server-side). `serde_json` is the
# JSON codec on the wire.
lsp-types = "0.97"
serde_json = "1.0"

# Claude Code IDE peer (the MCP adapter in lattice-ai, folded in by AG-4).
# `tokio-tungstenite` is the loopback WebSocket transport for the MCP
# JSON-RPC connection to an external `claude` CLI; default features only
# (no TLS — the bind is 127.0.0.1 + token-gated). `getrandom` mints the
# per-session auth token (16 random bytes → hex); a minimal, vetted CSPRNG
# primitive, no heavier `rand`/`uuid` dep pulled for one token.
tokio-tungstenite = "0.24"
getrandom = "0.2"

# Plugin host (Phase 7 -- lattice-plugin-host). The WASM Component
# Model extension substrate (design.md §5.5, docs/dev/architecture/
# plugin-host.md). `wasmtime` is the runtime + Component Model + WASI
# preview2 engine; `wasmtime-wasi` supplies the per-plugin WASI view
# (scoped fs/net) built from each plugin's capability grant.
# `wit-bindgen` generates the *guest* bindings (the host side uses
# `wasmtime::component::bindgen!`).
#
# Consumption is staged across the PH7.x slices, so several of these
# are declared here now (PH7.0 scaffold) but first exercised later:
#   - `wasmtime`      : PH7.0  (host engine + instantiate).
#   - `wasmtime-wasi` : PH7.2  (capability model builds the WASI view).
#   - `wit-bindgen`   : first consumer is the user's `init.rs` compiled
#                       to WASM (the degenerate no-op lifecycle component
#                       PH7.0 instantiates is the empty `init.rs`);
#                       `plugins/fuzzy-finder` (PH7.4) is the picker-seam
#                       validation, not the first consumer.
# Kept in lockstep: `wasmtime` and `wasmtime-wasi` share a major.
wasmtime = "46"
wasmtime-wasi = "46"
wit-bindgen = "0.58"
# PI.1: the plugin-API introspection catalog (`lattice-plugin-api`) parses
# `wit/` at BUILD time to derive its catalog. `wit-parser` is already in the
# tree transitively (wasmtime 46 pulls 0.251); pinning it as a build-dep reuses
# that exact locked version -- no new runtime dep enters any graph (it is a
# build-dependency of a leaf crate, so `lattice-host` can dep the catalog
# WITHOUT pulling wasmtime, keeping the no-per-frame-WASM invariant intact).
wit-parser = "0.251"
# `wat` assembles the hand-written no-op lifecycle component from
# WebAssembly Text to component bytes inside `cargo test` -- no
# `wasm32-wasip2` target or separate guest build needed for the PH7.0
# scaffold (that toolchain arrives with the real Rust guest at PH7.4).
wat = "1"

# Mode system (lattice-mode, M.1+). `internment` interns mode names
# (and later option / group names) so `ModeId` is `Copy + Eq + Hash`
# at zero allocation cost on the hot path. `bitflags` backs the
# `CapabilitySet` typed bitfield for capability validation at
# mode activation. `smallvec` keeps small contribution lists
# (typically 0-2 entries) inline.
internment = "0.8"
bitflags = "2"
smallvec = "1"

# Cross-crate distributed slices (lattice-config M.2.0). Aggregates
# every `options!` / `groups!` declaration across the workspace at
# link time; the registry's pre-`main` initialiser walks the
# slice to validate display-name uniqueness and register typed
# options. Same mechanism `inventory` uses, but `linkme` is the
# crate the broader Rust ecosystem (axum, dashmap, ...) has
# converged on -- better long-term support and clearer semantics.
linkme = "0.3"

# Proc-macro implementation (lattice-config-macros, M.2.0b).
# `syn` for full Rust syntax tree parsing of `options!` /
# `groups!` declaration blocks; `quote` for code generation;
# `proc-macro2` for token-stream interop. These compile only
# once for the proc-macro crate; runtime crates don't pay the
# cost.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Logging.
# Perf plan F: `release_max_level_debug` compile-time strips `trace!`
# (and the dispatch + format machinery behind it) in release builds.
# `debug!` and above stay live so production users can still flip
# `RUST_LOG=lattice_host=debug` for diagnosis without rebuilding.
# A.4's `lattice-ui-gpui/profile-frames` feature continues to gate
# the per-frame DEBUG hot-path calls a level below this.
tracing = { version = "0.1", features = ["release_max_level_debug"] }
# `env-filter` enables `EnvFilter` for msg-mode.2's
# `messages.filter` typed option (live-editable directive parser).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"

# CB.2 (docs/dev/architecture/clipboard.md): native OS clipboard
# (macOS / X11 / Wayland / Windows). Optional, feature-gated behind
# `lattice-ui-tui`'s `system-clipboard` feature -- mirrors the
# `lattice-ui-gpui`/`window` optional-dep pattern -- because arboard
# pulls X11/Wayland link libs on Linux that the default
# `cargo test --workspace` CI job doesn't install. The OSC52 fallback
# (write-only, no link deps) stays unconditional.
arboard = "3.6"
# CB.2: OSC52 clipboard-write escape sequences are base64-encoded
# payloads. No system-lib dependency, always compiled in (unlike
# arboard) so the fallback path never needs the `system-clipboard`
# feature.
base64 = "0.22"

# Syntax (tree-sitter)
tree-sitter = "0.26.11"
# Re-exported by tree-sitter for `QueryCursor::matches`. Direct dep
# so consumers (lattice-ui-tui's fold provider, future textobjects)
# can `use streaming_iterator::StreamingIterator` without going
# through tree-sitter's private re-export path.
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
# Markdown's grammar is intentionally split into a block parser and an
# inline parser -- one pass each, the block parser injects the inline
# parser into paragraph content. tree-sitter-md exposes both behind one
# crate; we register them as separate `HighlightConfiguration`s and the
# block grammar's injections.scm wires them together.
tree-sitter-md = "0.5"

# 15 additional Tier-1 language grammars
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-json = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-bash = "0.23"
tree-sitter-sequel = "0.3"
tree-sitter-lua = "0.5"

# Diff engine (lattice-diff -- D.1). `imara-diff` is the
# pure-Rust diff library shipped by gitoxide: Histogram by
# default (matches git 2.7+ output), Myers and Patience also
# supported. Pure compute, no I/O, no async. The Sink trait
# emits before/after line ranges; we collect them into typed
# `Hunk`s. See `docs/dev/architecture/diff-system.md` §4.
imara-diff = "0.1"

# Testing
insta = "1.43"
proptest = "1.7"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
# Isolated temp dirs for tests (e.g. the plugin-host module-cache test points
# wasmtime's on-disk cache at a per-test tempdir for a hermetic hit/miss count).
tempfile = "3"

# 2026-05-27: dev-profile tuning for fast iteration.
#
# Default `[profile.dev]` builds at `opt-level = 0` for every crate
# in the workspace AND every dependency. Lattice's own code at -O0
# is fine — it's the dependencies that hurt: tree-sitter, gpui,
# wgpu, alacritty, regex etc. all become 10-100× slower at runtime
# without basic optimization, making interactive testing on the
# debug profile painful (the user reported huge build times AND
# sluggish behaviour).
#
# Bumping every NON-workspace dependency to `opt-level = 1` gives
# near-release runtime smoothness while keeping incremental edits
# to lattice's own crates cheap to recompile (lattice's crates
# stay at `opt-level = 0`, so per-crate rebuild + link stays in the
# few-second range alongside the mold linker config in
# `.cargo/config.toml`).
#
# `package."*"` matches every non-workspace crate. Workspace crates
# stay at the top-level `[profile.dev]` setting (opt-level = 0).
#
# Trade-off accepted: first cold build is slightly heavier (deps
# compile with one pass of LLVM optimization instead of zero). After
# that, incremental builds touching only lattice crates do NOT
# recompile deps. Net: cold ~20% slower, incremental ~5× faster
# in practice.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 1

[profile.release]
# Perf plan F. Targets the GPUI peer's <3 ms idle frame / <6 ms p50
# keystroke budget by giving LLVM enough whole-program context to
# devirtualise + inline across crate boundaries, and by stripping the
# unwind landing pads (paramount goal #1: imperceptible keystroke ->
# glyph, within one display frame -- 8.3 ms at 120 Hz).
#
# Trade-offs accepted:
# - `codegen-units = 1` lengthens release link time; we eat it because
#   release is shipped infrequently and CI's hot incremental builds
#   stay on the dev profile.
# - `panic = "abort"` rules out unwinding; verified no non-test
#   `catch_unwind` exists in the workspace (config registry's two sites
#   are inside `#[test]` blocks which run under [profile.test]).
# - `lto = "thin"` chosen over "fat" to keep link time bounded while
#   still getting cross-crate inlining; revisit "fat" if profiling
#   shows residual indirect-call hot paths.
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
# Keep line tables so production panics still report file:line; the
# `strip = "symbols"` setting drops the heavy DWARF tables but leaves
# the cheap unwind metadata Rust needs for backtraces.
debug = "line-tables-only"

[workspace.lints.rust]
# `deny` (not `forbid`) so a hot-path module can opt in via
# `#![allow(unsafe_code)]` with a documented safety argument. The
# default for new code remains "no unsafe".
unsafe_code = "deny"
unused_must_use = "deny"
# objc 0.2's `msg_send!` / `sel_impl!` macros expand to a legacy
# `#[cfg(feature = "cargo-clippy")]`; declare that value as expected so the
# check-cfg lint doesn't warn on the expansion (used by lattice-ui-gpui's
# macOS `window_chrome::hide_traffic_lights`). Not a real feature; a fn-level
# `#[allow(unexpected_cfgs)]` cannot reach a macro-expansion cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
