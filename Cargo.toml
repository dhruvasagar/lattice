[workspace]
resolver = "2"
members = [
	"crates/lattice-protocol",
	"crates/lattice-core",
	"crates/lattice-grammar",
	"crates/lattice-syntax",
	"crates/lattice-ui-tui",
	"crates/lattice-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dhruvasagar/lattice"

[workspace.dependencies]
# Core
ropey = "1.6"
thiserror = "2.0"
anyhow = "1.0"

# Async (will be wired in later phases)
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
futures = "0.3"

# Serialization (Phase 0 just uses serde for protocol type derives)
serde = { version = "1.0", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"

# Syntax (tree-sitter)
tree-sitter = "0.24"
tree-sitter-highlight = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"

# Testing
insta = "1.43"
proptest = "1.7"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
