<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Lattice — a modal, GPU-accelerated, plugin-first text editor in Rust">
  <title>Lattice</title>
  
  <rect width="1280" height="640" fill="#fafafa"/>

  <defs>
    <pattern id="lattice-bg" x="-30" y="-30" width="160" height="160" patternUnits="userSpaceOnUse">
      <g opacity="0.04">
        <path d="M 0 20 L 20 20 L 20 100 L 80 100 L 80 120 L 0 120 Z" fill="#1f6feb"/>
        <path d="M 20 0 L 100 0 L 100 100 L 80 100 L 80 20 L 20 20 Z" fill="#1f6feb"/>
      </g>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#lattice-bg)"/>

  <!-- 
    Adjusted from measurements:
    - Shift mark+wordmark right by 41px to center the unit on the canvas
    - Lift content up by ~50px to balance vertical breathing room
    - Tagline stays canvas-centered horizontally
  -->

  <!-- Mark: was at x=170, now x=211 (170+41) -->
  <g transform="translate(211, 150) scale(2.4)">
    <path d="M 0 20 L 20 20 L 20 100 L 80 100 L 80 120 L 0 120 Z" fill="#1f6feb"/>
    <path d="M 20 0 L 100 0 L 100 100 L 80 100 L 80 20 L 20 20 Z" fill="#1f6feb"/>
    <rect x="40" y="36" width="20" height="48" fill="#f59e0b"/>
  </g>

  <!-- Wordmark: was at x=450, now x=491 (450+41), baseline raised to y=370 -->
  <text x="491" y="370" fill="#1f6feb"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="180" font-weight="500" letter-spacing="-4">Lattice</text>

  <!-- Tagline: canvas-centered, lifted to y=520 -->
  <text x="640" y="520" fill="#64748b" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="32" font-weight="400" letter-spacing="0.5">A modal, GPU-accelerated, plugin-first text editor in Rust</text>
</svg>
