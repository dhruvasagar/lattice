[package]
name = "lattice-cells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# S1 — pure substrate types for the cell-grid renderer
# (`docs/dev/architecture/cell-grid-renderer.md`). Pure data:
# no rendering, no rope, no I/O. Both renderer crates and the
# host substrate depend on this. Construction logic and the
# cell-builder worker land in S2 in `lattice-host`.

[lib]
# Build-time: this crate has no doc examples, and `cargo test -p <crate>`
# still compiles + links a doctest binary for it regardless. Measured at
# ~100s of "merged doctests compilation" on a comparable crate, paid on
# every test invocation. Turn it back on the moment a `///  ```rust`
# example lands here — the point is to stop paying for nothing, not to
# discourage examples.
doctest = false

[dependencies]
# `Arc<[T]>` everywhere; otherwise deliberately near-dep-free.
#
# DL.1: `lattice-theme` is the one exception, so `Style::Element` can
# carry a real `ElementId` instead of a bare `u32`. The edge is safe —
# `lattice-theme` is itself a minimal leaf (arc-swap + tracing only,
# kept that way precisely because it sits on the renderer hot path) —
# and it is what lets a mode- or plugin-registered theme element style
# a span at all.
lattice-theme = { path = "../lattice-theme" }

[dev-dependencies]
# D.0a (2026-05-28): bench virtual_row_layout + display_slice
# interleaver against realistic 1k-virtual-row inputs. CI gate
# enforcement deferred to a downstream consumer slice.
criterion = { workspace = true }

[[bench]]
name = "virtual_rows"
harness = false

# TC.1 — the resolver is the only part of tree-sitter context on the
# keystroke path, so it gets a recorded number from the start.
[[bench]]
name = "context"
harness = false

[lints]
workspace = true
