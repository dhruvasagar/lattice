[package]
name = "lattice-cells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# S1 — pure substrate types for the cell-grid renderer
# (`docs/dev/architecture/cell-grid-renderer.md`). Pure data:
# no rendering, no rope, no I/O. Both renderer crates and the
# host substrate depend on this. Construction logic and the
# cell-builder worker land in S2 in `lattice-host`.

[lib]
# Build-time: this crate has no doc examples, and `cargo test -p <crate>`
# still compiles + links a doctest binary for it regardless. Measured at
# ~100s of "merged doctests compilation" on a comparable crate, paid on
# every test invocation. Turn it back on the moment a `///  ```rust`
# example lands here — the point is to stop paying for nothing, not to
# discourage examples.
doctest = false

[dependencies]
# `Arc<[T]>` everywhere. No other deps until S2 needs them.

[dev-dependencies]
# D.0a (2026-05-28): bench virtual_row_layout + display_slice
# interleaver against realistic 1k-virtual-row inputs. CI gate
# enforcement deferred to a downstream consumer slice.
criterion = { workspace = true }

[[bench]]
name = "virtual_rows"
harness = false

[lints]
workspace = true
