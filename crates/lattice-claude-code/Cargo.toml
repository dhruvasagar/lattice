[package]
name = "lattice-claude-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lattice-protocol = { path = "../lattice-protocol" }
lattice-mode = { path = "../lattice-mode" }
lattice-grammar = { path = "../lattice-grammar" }
# I2.1: the read-state cache subscribes to the generic event bus
# (`EventBus`/`EventFilter`/`SubscriptionTarget`) to track open buffers +
# the active selection off the editor thread.
lattice-runtime = { path = "../lattice-runtime" }
# I2.2: read tools consume generic services — `lattice-core` for the
# `BufferStore`'s `BufferId`, `lattice-lsp` for the `DiagnosticsQuery`
# service + `Diagnostic` type (`getDiagnostics`). The diagnostics edge is a
# legitimate semantic dep (the IDE reports LSP diagnostics to the agent).
lattice-core = { path = "../lattice-core" }
lattice-lsp = { path = "../lattice-lsp" }
# I4 (openDiff): the programmatic-diff request type + bus + `DiffOutcome` the
# `openDiff` tool produces and awaits. A network-peer → diff-subsystem edge, the
# same shape as the ide→lsp edge above the read tools already use.
lattice-diff = { path = "../lattice-diff" }
lattice-agent = { path = "../lattice-agent" }
tokio = { workspace = true, features = [
	"sync",
	"rt",
	"rt-multi-thread",
	"macros",
	"net",
	"io-util",
	"time",
] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "time", "macros", "rt", "net"] }
futures = { workspace = true }

[lints]
workspace = true
