[package]
name = "lattice-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lattice"
path = "src/main.rs"

[dependencies]
lattice-core = { path = "../lattice-core" }
lattice-ui-tui = { path = "../lattice-ui-tui" }
# 2026-05-22 messages-overhaul: CLI calls `set_boot_log_level`
# to hand the -v/-q/--log-level flags to the boot-installed
# tracing subscriber. Avoids `std::env::set_var` (denied by
# `#![deny(unsafe_code)]`).
lattice-runtime = { path = "../lattice-runtime" }
# 5.9 / 5.8.M: optional GPUI peer renderer. Off by default so
# `cargo build -p lattice-cli` and `cargo test -p lattice-cli` stay
# headless-friendly (no system-display-lib link required). Enable
# with `cargo build --features gui` to get `lattice --gui`.
lattice-ui-gpui = { path = "../lattice-ui-gpui", optional = true }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Tracing init for the unified binary — `RUST_LOG=…` env-var-driven
# subscriber so debug logs flow to stderr on demand.
tracing-subscriber = { workspace = true }

[features]
default = []
# 5.9 / 5.8.M: opt-in routing to the GPUI peer via `lattice --gui`.
# Pulls in `lattice-ui-gpui` with its own `window` feature on,
# which in turn links real gpui (needs display libs at link time
# on Linux: `libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev`).
gui = ["dep:lattice-ui-gpui", "lattice-ui-gpui/window"]
# CB.2 (docs/dev/architecture/clipboard.md): opt-in native OS clipboard
# support via `cargo build --features clipboard`. Off by default for the
# same headless-CI reason as `gui`. Without it, yank still reaches the
# real system clipboard via the OSC52 write fallback -- this feature only
# adds clipboard *read* (paste-from-another-app) + native Wayland/X11
# write. CB.4 wires the equivalent for the `--gui` (GPUI) peer.
clipboard = ["lattice-ui-tui/system-clipboard"]

[lints]
workspace = true

# cargo-bundle metadata — used by `cargo bundle --features gui` to
# produce a native .app (macOS) / .deb / .rpm / AppImage (Linux).
# Install cargo-bundle once: `cargo install cargo-bundle`
# Then build: `cargo bundle --release --features gui`
[package.metadata.bundle]
name            = "Lattice"
identifier      = "com.lattice-editor.lattice"
# Path is relative to this Cargo.toml.  icns for macOS; cargo-bundle
# falls back to the PNG list on Linux (uses the largest square PNG).
icon            = [
    "../../assets/lattice.icns",
    "../../assets/favicon-16.png",
    "../../assets/favicon-32.png",
    "../../assets/favicon-64.png",
]
short_description = "A modal, GPU-accelerated, plugin-first text editor"
long_description  = "Combines vim's modal editing power with emacs's extensibility model on a non-blocking, multi-threaded core."
copyright       = "Copyright © 2024 Dhruva Sagar"
category        = "developer-tools"

# cargo-deb config — used by the release pipeline (`cargo deb --no-build`).
# Installs the binary, the freedesktop desktop entry, and square hicolor
# icons renamed to the desktop's Icon= key. Icons come from the square
# iconset, NOT the non-square assets/lattice-mark-512.png.
[package.metadata.deb]
maintainer = "Dhruva Sagar <dhruva.sagar@gmail.com>"
copyright = "Copyright © 2024 Dhruva Sagar"
license-file = ["../../LICENSE", "0"]
extended-description = "Combines vim's modal editing power with emacs's extensibility model on a non-blocking, multi-threaded core."
section = "editors"
priority = "optional"
assets = [
    ["target/release/lattice", "usr/bin/", "755"],
    ["../../assets/linux/com.lattice-editor.lattice.desktop", "usr/share/applications/com.lattice-editor.lattice.desktop", "644"],
    ["../../assets/lattice.iconset/icon_16x16.png",   "usr/share/icons/hicolor/16x16/apps/com.lattice-editor.lattice.png",   "644"],
    ["../../assets/lattice.iconset/icon_32x32.png",   "usr/share/icons/hicolor/32x32/apps/com.lattice-editor.lattice.png",   "644"],
    ["../../assets/lattice.iconset/icon_32x32@2x.png","usr/share/icons/hicolor/64x64/apps/com.lattice-editor.lattice.png",   "644"],
    ["../../assets/lattice.iconset/icon_128x128.png", "usr/share/icons/hicolor/128x128/apps/com.lattice-editor.lattice.png", "644"],
    ["../../assets/lattice.iconset/icon_256x256.png", "usr/share/icons/hicolor/256x256/apps/com.lattice-editor.lattice.png", "644"],
    ["../../assets/lattice.iconset/icon_512x512.png", "usr/share/icons/hicolor/512x512/apps/com.lattice-editor.lattice.png", "644"],
]
