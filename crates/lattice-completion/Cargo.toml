[package]
name = "lattice-completion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lattice-protocol = { path = "../lattice-protocol" }
lattice-core = { path = "../lattice-core" }
lattice-grammar = { path = "../lattice-grammar" }
# PH.1: `Style` for `DisplaySpan` (syntax-colored picker previews).
# `lattice-cells` is a leaf crate (no path deps), so this edge
# introduces no dependency cycle — verified before adding.
lattice-cells = { path = "../lattice-cells" }
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# MARG.4 (2026-06-03): annotation-pipeline bench harness.
# Same workspace criterion as the rest of the bench crates
# (`lattice-config`, `lattice-core`, `lattice-cells`,
# `lattice-host`); not pulled into release builds.
criterion = { workspace = true }

[[bench]]
name = "annotation_pipeline"
harness = false

[lints]
workspace = true
