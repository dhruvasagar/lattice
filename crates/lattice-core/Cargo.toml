[package]
name = "lattice-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Doctests are ON: the crate's key entry points (Buffer, Document,
# UndoStack, search, PaneTree, labeled_enum!, …) carry runnable
# `# Examples`, and an unverified example is what
# docs/dev/architecture/api-docs.md §3.2 exists to prevent. The cost —
# a doctest binary compiled and linked on every `cargo test -p
# lattice-core` — is accepted for that reason.
doctest = true

[dependencies]
# `~` expansion needs a home directory that answers on Windows too
# (`%USERPROFILE%`), which `std::env::var_os("HOME")` does not — see `home.rs`.
dirs = { workspace = true }
lattice-protocol = { path = "../lattice-protocol" }
ropey = { workspace = true }
memchr = { workspace = true }
fancy-regex = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "buffer"
harness = false

# M.-0 (2026-05-31): Document hot-path baseline ahead of M.0's
# trait + ArcSwap refactor. Two groups — `document_read_p99_us`
# (renderer per-frame Document reads) and `document_edit_p99_us`
# (dispatcher per-keystroke Document writes) — give M.0 a
# no-regression gate. See `benches/document_hotpath.rs`.
[[bench]]
name = "document_hotpath"
harness = false

[[bench]]
name = "pane_layout"
harness = false

[lints]
workspace = true
