[package]
name = "lattice-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Build-time: this crate has no doc examples, and `cargo test -p <crate>`
# still compiles + links a doctest binary for it regardless. Measured at
# ~100s of "merged doctests compilation" on a comparable crate, paid on
# every test invocation. Turn it back on the moment a `///  ```rust`
# example lands here — the point is to stop paying for nothing, not to
# discourage examples.
doctest = false

[dependencies]
lattice-protocol = { path = "../lattice-protocol" }
ropey = { workspace = true }
memchr = { workspace = true }
fancy-regex = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "buffer"
harness = false

# M.-0 (2026-05-31): Document hot-path baseline ahead of M.0's
# trait + ArcSwap refactor. Two groups — `document_read_p99_us`
# (renderer per-frame Document reads) and `document_edit_p99_us`
# (dispatcher per-keystroke Document writes) — give M.0 a
# no-regression gate. See `benches/document_hotpath.rs`.
[[bench]]
name = "document_hotpath"
harness = false

[lints]
workspace = true
