[package]
name = "lattice-diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# D.1 (in design ledger): pure data layer for Lattice's diff
# subsystem. Two-way and three-way hunk computation over
# `&ropey::Rope` inputs, backed by `imara-diff` (Histogram by
# default; Myers + Patience also wired). No host integration,
# no actor plumbing -- those land in D.2.
#
# See `../../docs/dev/architecture/diff-system.md` §3.1 for the
# type model this crate exposes.

[dependencies]
imara-diff = { workspace = true }
ropey = { workspace = true }
smallvec = { workspace = true }
# D.8.a: `DiffEngineError` for the `compute_diff` dispatch
# entry. Derive-only crate, zero runtime impact.
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "recompute"
harness = false

[lints]
workspace = true
