[package]
name = "lattice-grammar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lattice-protocol = { path = "../lattice-protocol" }
lattice-core = { path = "../lattice-core" }
# PL8.B / B3b: `CommandRegistryHandle` holds the registry behind
# `ArcSwap` so the plugin loader can RCU-register a runtime grammar
# contribution while the dispatch path reads it wait-free.
arc-swap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# msg-mode.1: EchoLevel ↔ tracing::Level conversion lives next
# to EchoLevel so the wire-typed grammar enum stays the single
# source of truth for severity. Pulling `tracing` here is cheap
# (one-trait crate, no runtime cost without a subscriber).
tracing = { workspace = true }

[dev-dependencies]
serde_json = "1.0"
criterion = { workspace = true }

[[bench]]
name = "motions"
harness = false

[[bench]]
name = "operators"
harness = false

[lints]
workspace = true
