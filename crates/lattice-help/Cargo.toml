[package]
name = "lattice-help"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Build-time: this crate has no doc examples, and `cargo test -p <crate>`
# still compiles + links a doctest binary for it regardless. Measured at
# ~100s of "merged doctests compilation" on a comparable crate, paid on
# every test invocation. Turn it back on the moment a `///  ```rust`
# example lands here — the point is to stop paying for nothing, not to
# discourage examples.
doctest = false

[dependencies]
lattice-core = { path = "../lattice-core" }
lattice-protocol = { path = "../lattice-protocol" }
lattice-syntax = { path = "../lattice-syntax" }
lattice-completion = { path = "../lattice-completion" }
zstd = { workspace = true }
# CR.1: `HelpTopicRegistryHandle = Arc<ArcSwap<HelpTopicRegistry>>` — the
# copy-on-write RCU handle a plugin's `:help` pages register through. Same
# idiom as the command / picker / compilation-parser registries.
arc-swap = { workspace = true }
# HP.1: help buffers align their tables at content-build time via
# `lattice_mode::modes::table::layout`, which table-mode will share.
lattice-mode = { path = "../lattice-mode" }

[build-dependencies]
# `zdict_builder` trains the shared dictionary; only the build script
# needs it, so the runtime edge above stays decode-and-compress only.
zstd = { workspace = true, features = ["zdict_builder"] }

[dev-dependencies]
criterion = { workspace = true }

# HD.5: the cost of the compressed-embed scheme — boot must not
# decompress, first open must stay imperceptible, cached opens free.
# The shared-dictionary scheme adds the one-time dictionary setup.
[[bench]]
name = "topics"
harness = false

[lints]
workspace = true
