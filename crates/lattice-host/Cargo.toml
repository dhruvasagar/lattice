[package]
name = "lattice-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Renderer-agnostic substrate. Owns the App state, dispatch, picker
# sources, mode lifecycle, LSP coordination, options cascade, keymap
# registry, buffer registry, folds, search, completion engine, file
# ops, oil + file-tree state. Both `lattice-ui-tui` and (Phase 5.7+)
# `lattice-ui-gpui` depend on this crate; neither depends on the
# other.
#
# Anchor: docs/dev/architecture/phase-5-extraction.md (the slice plan).
#
# Phase 5.1: this crate is intentionally empty. Slice 5.2 begins
# migrating renderer-agnostic modules out of `lattice-ui-tui` and
# into this crate, one or two modules per commit, with the TUI
# re-exporting via `pub use lattice_host::*;` so downstream
# consumers don't break across the move.

[dependencies]
# Phase 5.2 first wave: trivial re-export shims for the buffer +
# popup + help + file-tree + oil domain types. The real
# definitions already live in their domain crates; this crate
# hosts the canonical "host-side" path (`lattice_host::buffers`,
# `lattice_host::help`, ...) and `lattice-ui-tui` re-exports
# from here for backward compat.
lattice-core = { path = "../lattice-core" }
lattice-help = { path = "../lattice-help" }
# DB.2: host links lattice-dashboard for the mode id + registry service +
# install (Phase-B). The host owns fragment -> HelpContent conversion +
# BufferData::Dashboard creation (it owns the help machinery).
lattice-dashboard = { path = "../lattice-dashboard" }
lattice-file-tree = { path = "../lattice-file-tree" }
lattice-oil = { path = "../lattice-oil" }
# Phase 5.2 second wave: actions + excommand. Pure renderer-
# agnostic logic that depends only on the grammar + protocol
# substrate.
lattice-grammar = { path = "../lattice-grammar" }
lattice-protocol = { path = "../lattice-protocol" }
# K.3 (2026-06-07): keymap types moved to lattice-keymap
lattice-keymap = { path = "../lattice-keymap" }
thiserror = { workspace = true }
# Phase 5.2 third wave: host_generators (picker-source completion
# generators). Reaches into mode, picker, lsp, config for the
# generators that enumerate registered modes, pickers, LSP
# servers, and customizable option names.
lattice-completion = { path = "../lattice-completion" }
lattice-mode = { path = "../lattice-mode" }
lattice-picker = { path = "../lattice-picker" }
lattice-lsp = { path = "../lattice-lsp" }
# T1 (2026-05-22): terminal-mode substrate. PtyHandle +
# TerminalSnapshot for BufferData::Terminal storage; `spawn`
# called by Editor::do_terminal_spawn.
lattice-terminal = { path = "../lattice-terminal" }
lattice-config = { path = "../lattice-config" }
# Phase 5.2: keymap_registry uses `arc_swap::ArcSwap` for the
# lock-free keymap snapshot the input dispatcher reads each
# keystroke.
arc-swap = { workspace = true }
# Phase 5.2: folds.rs uses `tree_sitter::QueryCursor` for the
# syntax-fold provider; modes.rs touches `lattice_syntax::Lang`.
lattice-syntax = { path = "../lattice-syntax" }
# T.1 (theme-system slice plan): renderer-neutral theme
# primitives (`Color` / `Style` / `Modifiers` / `NamedColor` +
# rich-vocab attrs + `parse_color`) live in this leaf crate;
# `lattice_host::ui::theme` re-exports them so existing call sites
# are unchanged. See docs/dev/architecture/theme-system.md.
lattice-theme = { path = "../lattice-theme" }
# S2.1 (2026-05-26): cell-grid renderer substrate. `RenderState`
# carries a `CellsRenderState` whose
# `matrix: Arc<ArcSwap<CellMatrix>>` is the contract with the
# renderers (S3 TUI, S4 GPU). See
# `docs/dev/architecture/cell-grid-renderer.md`.
lattice-cells = { path = "../lattice-cells" }
# D.2.a (2026-05-28): diff-subsystem skeleton. `DiffSubsystem`
# holds per-buffer `DiffSession` registry; sessions wrap
# `lattice-diff`'s `HunkIndex` in `ArcSwap` for RCU-published
# reads. Compute lands D.2.b. See
# `docs/dev/architecture/diff-system.md`.
lattice-diff = { path = "../lattice-diff" }
# IDE-protocol: the Claude Code IDE peer. Boot spawns its server
# supervisor (idle until `:claude-code-start`), registers the handle as a
# service, and wires `claude-code-mode` + the `:claude-code-*` ex-commands.
lattice-claude-code = { path = "../lattice-claude-code" }
# D.2.b (2026-05-28): `BaselineSource::snapshot(&self) -> Rope`
# trait + `StaticBaseline` impl + `DiffSession::recompute_blocking`
# (and `DiffSubsystem::schedule_recompute` on `spawn_blocking`)
# need direct `ropey::Rope` paths in the diff::subsystem module.
ropey = { workspace = true }
tree-sitter = { workspace = true }
streaming-iterator = { workspace = true }
# modes.rs references the snippet major-mode id.
lattice-snippet = { path = "../lattice-snippet" }
# buffer_registry.rs uses `lattice_runtime::RopeDocumentHandle`.
lattice-runtime = { path = "../lattice-runtime" }
# M.2.b.1 (2026-05-31): host depends on `lattice-multibuffer` for
# boot-wiring registration only (every multibuffer-specific
# concern lives in that crate).
lattice-multibuffer = { path = "../lattice-multibuffer" }
# Phase 5.B.11: `Editor` holds typed `tokio::sync::mpsc`
# receivers (message events; later: LSP request channels).
# Naming those receiver types requires tokio as a direct dep.
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
# CB.4 (docs/dev/architecture/clipboard.md): the native `arboard`
# clipboard backend shared by BOTH renderer peers lives here (host has
# tokio for the bounded read + is depended on by both peers). Optional /
# feature-gated behind `system-clipboard` so host's default build stays
# free of the X11/Wayland link libs; a peer opts in via
# `lattice-host/system-clipboard`.
arboard = { workspace = true, optional = true }
# Phase 5.B.18 / refactor #70: LSP request channels carry
# `lsp_types::*` values (CodeLens, ColorPresentation, Range,
# Location, MessageActionItem). These are reached through
# `lattice_lsp::lsp_types::*` — `lsp-types` proper stays
# encapsulated behind `lattice-lsp`. No direct `lsp-types` dep here.
toml = { workspace = true }
# T.1: TutorSession sidecar TOML deserialization.
serde = { workspace = true }
# T.B: tutor high-score persistence path via data_local_dir().
dirs = { workspace = true }
# 5.7.B.7: `Editor::lookup_lsp_config_section` round-trips
# toml::Value -> serde_json::Value so it can ship the
# server-namespaced config subtree to LSP actors via
# `workspace/didChangeConfiguration`.
serde_json = { workspace = true }
notify = { workspace = true }
# Phase 5.8.AF.4: structured debug logging for diagnosing
# main-thread blocking calls (notably `notify`'s recursive watch
# install on cold workspace roots). Filterable via
# `RUST_LOG=lattice_host=debug`; default subscriber filter is
# `info` so this is silent in normal operation.
tracing = { workspace = true }
# Phase 5.8.AF.5 Slice 2: source-side filtering for the LSP
# file-watcher. `ignore` provides `.gitignore` / `.ignore` /
# global-gitignore aware path matching; `globset` compiles the
# baked default exclude patterns (`**/target/**`, `**/.git/**`,
# ...) into one aho-corasick-backed matcher. Both consulted in
# the notify callback so events for ignored paths never enter
# the channel.
ignore = { workspace = true }
globset = { workspace = true }
# 5.5.E.7.5: `Editor::do_substitute` compiles `:s/pat/repl/`
# patterns host-side via the same fancy-regex engine that backs
# `/` and `?` in `lattice-core::search`.
fancy-regex = { workspace = true }
# Perf plan A.2 / display-line B4.2: `overlay_worker` SIMD-scans the
# SyntaxSnapshot source bytes for newline offsets to seek per-row
# source-line extents without copying. `memchr` is already a
# transitive dep via tree-sitter; promoting it to a direct dep gives
# us `memchr::memchr` without going through that re-export.
memchr = { workspace = true }

[dev-dependencies]
# Phase 5.8.AF.6 / Slice X2.9 (gut + rename B4.2): overlay worker
# bench (`benches/overlay_worker.rs`) needs criterion + a real
# `Syntax` instance to feed the worker recompute path.
criterion = { workspace = true }
# D.2.c (2026-05-29): diff-subsystem debouncer tests use
# `#[tokio::test(start_paused = true)]` + `tokio::time::advance`
# to drive the lazy debounce task deterministically without
# wall-clock waits. The `test-util` feature is dev-only.
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
# D.3.a (2026-05-29): diff-overlay provider tests construct
# `Hunk { ranges: SmallVec<[LineRange; 3]> }` directly via the
# `smallvec!` macro. Production code uses `Hunk` values
# emitted by `lattice-diff`'s `compute_two_way` — no host-side
# allocation; the dev-dep is purely for inline test fixtures.
smallvec = { workspace = true }

[[bench]]
name = "overlay_worker"
harness = false

# Perf plan B.4: measures the dispatch publish path. Captures the
# steady-state (no-op) publish cost where the sub-state cache
# should reuse every cached `Arc` and the build cost where it
# rebuilds them. See `benches/dispatch_publish.rs`.
[[bench]]
name = "dispatch_publish"
harness = false

# S5 (2026-05-27): cells_worker hot-path bench. Times
# `recompute` across three workloads — full rebuild (cache miss),
# incremental single-line edit, cache hit — at varying line
# counts so the chunked-mode threshold (4 × viewport_height) is
# exercised on both sides. See `benches/cells_worker.rs`.
[[bench]]
name = "cells_worker"
harness = false

# D.2.e (2026-05-29): diff-subsystem hot-path bench. Three
# workloads — `recompute_blocking` at 1k/5k/50k lines,
# `routing_fanout` with N=10/100/1000 watching sessions, raw
# `Debouncer::poke` cost. Backs the §3.4 "routing cost
# independent of session count" claim. See
# `benches/diff_subsystem.rs`.
[[bench]]
name = "diff_subsystem"
harness = false

# D.3.f.2 (2026-05-29): fold-recompute hot-path bench. Three
# workloads — `overlay_only_at_n_hunks` (Editor::recompute_folds
# with N hunks at foldmethod=Manual),
# `hunk_provider_compute_pure` (isolated provider compute),
# `fold_identity_hash` (raw identity-hash cost). Backs the
# `fold-architecture.md` §4 keystroke-budget claim. See
# `benches/fold_recompute.rs`.
[[bench]]
name = "fold_recompute"
harness = false

# D.4.e (2026-05-30): pane-group scroll-binding hot-path bench.
# Three workloads — `pane_group_no_group` (early-return cost
# paid by every publish when no group is registered),
# `pane_group_identity_propagation` (2-pane identity-mapper
# propagation per tick), `hunk_row_map_p99_us`
# (`HunkRowMapper::map_row` at 100 hunks). Backs the
# `diff-system.md` §7 `diff_scroll_bind_p99_us` keystroke-
# budget claim. See `benches/pane_group.rs`.
[[bench]]
name = "pane_group"
harness = false

# ML.1a-render: modeline build cost stays O(elements). See
# `benches/modeline.rs`.
[[bench]]
name = "modeline"
harness = false

# DB.7 (design.md §13): dashboard creation-time compose+seed +
# idle-frame tick cost. The dashboard has no keystroke path, so these
# two assertions (not a keystroke bench) are the coverage. See
# `benches/dashboard.rs`.
[[bench]]
name = "dashboard"
harness = false

# CB.5: yank-path cost — the clipboard mirror must add only constant
# overhead to `store_yank` on the keystroke path (paramount #1).
[[bench]]
name = "clipboard_yank"
harness = false

[features]
# M.6 (2026-06-01): toggle the project-search provider on /
# off. Forwards to `lattice-multibuffer`'s `search` feature so
# the `ignore` dep lights up only when this is enabled.
default = ["search"]
search = ["lattice-multibuffer/search"]
# CB.4: compile the native `arboard` clipboard backend
# (`crate::clipboard::ArboardClipboard`). Off by default; the TUI peer
# (`lattice-ui-tui/system-clipboard`) and GPUI peer (via its `window`
# feature) forward to this. Pulls X11/Wayland link libs on Linux.
system-clipboard = ["dep:arboard"]

[lints]
workspace = true
