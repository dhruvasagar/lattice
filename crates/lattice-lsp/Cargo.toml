[package]
name = "lattice-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lattice-protocol = { path = "../lattice-protocol" }
lattice-mode = { path = "../lattice-mode" }
# L4b: lsp-diagnostics-mode's `gl` action handler returns
# `lattice_grammar::Effect::ShowDiagnosticsPopup`. Edge already exists
# transitively (lattice-mode -> lattice-grammar); direct dep makes the
# import path explicit.
lattice-grammar = { path = "../lattice-grammar" }
lattice-config = { path = "../lattice-config" }
# BC.8b: the mode-owned `workspace/configuration` handler reads the merged
# `lsp.*` tree via `lattice_config::lookup_dotted_path(&toml::Table, …)`.
toml = { workspace = true }
# CSM.8: lsp-completion-mode contributes the LSP completion
# source through `lattice-completion::AsyncCompletionSource`.
# Edge already exists transitively (lattice-mode ->
# lattice-completion); direct dep makes the import path
# explicit.
lattice-completion = { path = "../lattice-completion" }
lattice-core = { path = "../lattice-core" }
lattice-runtime = { path = "../lattice-runtime" }
lattice-help = { path = "../lattice-help" }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "process", "io-util", "time"] }
linkme = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lsp-types = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
# 4.4.l: glob matching for the file-watcher subscription set.
# `globset::GlobSet` compiles N patterns into one matcher so
# per-fs-event cost is O(1) regardless of how many globs the
# server registered.
globset = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "time"] }
criterion = { workspace = true }

[[bench]]
name = "lsp"
harness = false

# M-async.5: dispatch latency for `LspMode` activation under the
# spawn-based cascade driver. Two cases (no-server-config and
# unregistered-supervisor); pinned in CI to catch regressions
# in the registry / cascade / epoch counter path.
[[bench]]
name = "mode_activate"
harness = false

[lints]
workspace = true
