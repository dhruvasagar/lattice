[package]
name = "lattice-magit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# MG.1+: Magit — git porcelain as a core plugin.
#
# Feature-buffer crate inverted out of lattice-host (same tier as
# oil/file-tree/compilation). Owns every magit buffer view's mode,
# keymap, action handler, and synthetic-buffer provisioning. Installs
# through SubsystemBoot seam.
#
# See docs/dev/architecture/magit.md and
# docs/dev/operations/slice-plans/magit.md.

[dependencies]
lattice-vcs = { path = "../lattice-vcs" }
lattice-diff = { path = "../lattice-diff" }
lattice-mode = { path = "../lattice-mode" }
lattice-runtime = { path = "../lattice-runtime" }
lattice-core = { path = "../lattice-core" }
lattice-protocol = { path = "../lattice-protocol" }
lattice-grammar = { path = "../lattice-grammar" }
lattice-config = { path = "../lattice-config" }
lattice-keymap = { path = "../lattice-keymap" }
lattice-theme = { path = "../lattice-theme" }
lattice-picker = { path = "../lattice-picker" }
lattice-completion = { path = "../lattice-completion" }
lattice-cells = { path = "../lattice-cells" }
lattice-notify = { path = "../lattice-notify" }
lattice-syntax = { path = "../lattice-syntax" }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tracing = { workspace = true }
ropey = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
# MG.18c: the hunk-staging wiring tests spawn a real document actor to
# resolve a hunk from real buffer text, and `spawn_document` wants a
# `CommandRegistryHandle` (an `ArcSwap`) even though these buffers
# dispatch nothing.
arc-swap = { workspace = true }

# MG.14: the headerline's per-tick `version()` cost. It resolves theme
# colours live (so `:colorscheme` lands on the row) rather than
# capturing them at activation, which puts a theme-registry read-lock on
# the cells worker's every tick — this bench is what keeps that choice
# honest.
[[bench]]
name = "headerline"
harness = false

# MG.18c: the cost of resolving the hunk under the cursor must not
# scale with the buffer it sits in — the reason the parser reads
# through an accessor instead of collecting the document.
[[bench]]
name = "hunk_staging"
harness = false

[lints]
workspace = true
