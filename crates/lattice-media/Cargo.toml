# IM.4 — image decode, shared by both renderer peers.
#
# A crate rather than a module, on the dependency-surface test (CLAUDE.md
# heuristic #6). Two things it carves out:
#
# 1. The image CODEC graph — `image` plus its png / jpeg / gif / webp backends.
#    `lattice-cells` has ONE dependency today and 10+ dependents; putting
#    decoders there compiles codec code into the closure of every one of them,
#    `lattice-completion` and `lattice-listing` included.
#
# 2. A home that is neither peer. Decode is GPUI-only *today*, but terminal
#    graphics (kitty / sixel / iTerm2) is explicitly not foreclosed — see
#    docs/dev/architecture/inline-media.md §9. The day the TUI grows an image
#    path, both peers need this code, and a thing both peers need can live in
#    neither of them.
#
# (2) is the load-bearing half. An earlier version of this comment claimed the
# crate made UI-thread decode "structurally impossible" because it depends on
# no renderer. That was wrong and is worth recording: having no renderer
# dependency stops THIS crate calling into paint, and does nothing to stop a
# renderer calling the synchronous `decode` from inside a render pass. The
# off-thread guarantee comes from the call site using `spawn_blocking` and
# from the tests that assert it — not from this dependency edge.

[package]
name = "lattice-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
lattice-cells = { path = "../lattice-cells" }
# `default-features = false` then opt in: the default feature set pulls every
# codec plus rayon. These four cover what an org buffer references in
# practice, and each one added later is a deliberate choice rather than a
# transitive surprise.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }
# SVG is a vector format, so `image`'s raster decoders cannot touch it: an
# `.svg` probed as a picture and failed, and the block fell back to alt text.
# resvg brings its own `usvg` (parse + text layout) and `tiny-skia` (raster)
# and re-exports both, so this one line is the whole dependency.
#
# It is the largest thing in this crate's tree and it is NOT free for a
# TUI-only build, where gpui — which already pulls the same pinned 0.45 — is
# absent. Taken deliberately: an SVG in a notes corpus is as ordinary as a
# PNG, and a diagram that silently shows its filename instead of itself is
# the failure this crate exists to prevent.
resvg = { version = "0.45", default-features = false, features = [
  "text",
  "system-fonts",
] }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
