[package]
name = "lattice-mode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
internment = { workspace = true }
bitflags = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
lattice-protocol = { path = "../lattice-protocol" }
# M.4 dep-inversion: modes contribute typed-option overrides
# (e.g. `Mode::options() -> OptionOverrideSet`); the override
# types live in `lattice-config`, so `lattice-mode` pulls them
# in. Cycle through `lattice-core -> lattice-mode` is gone now
# that `Document::modes` retired.
lattice-config = { path = "../lattice-config" }
# CSM.1 (insert-completion.md §12): modes contribute completion
# sources via `Mode::completion_sources() ->
# Vec<CompletionSourceContribution>`. The contribution type +
# trait surface live in `lattice-completion`. Edge already exists
# transitively (lattice-config -> lattice-completion); the direct
# dep just makes the import path explicit.
lattice-completion = { path = "../lattice-completion" }
# Phase 2 ModeContext extension: lifecycle hooks can publish
# typed events via `ctx.events()`. The event bus type lives in
# `lattice-runtime`.
lattice-runtime = { path = "../lattice-runtime" }
# B'.1 mode-owns-its-buffers: modes synthesize buffers (e.g.
# LspLogMode creates `*lsp*`) via a `BufferStore` service. The
# host-facing trait lives here so any mode crate can pull it;
# the concrete impl is owned by the renderer crate
# (lattice-ui-tui) and registered into `ServiceRegistry` at boot.
# Direct dep on lattice-core for BufferId / BufferFlags.
lattice-core = { path = "../lattice-core" }
# M-async.2: `ModeEvent` registered as a typed event via
# `register_event!` so the dispatcher publishes lifecycle
# transitions through the typed event bus. `register_event!`
# expands to a `#[linkme::distributed_slice(...)]` static, so
# every caller crate needs `linkme` as a direct dep -- proc-macro
# attribute paths can't route through re-exports.
linkme = { workspace = true }
# H.2 (2026-05-31): ModeRegistry uses `tracing::warn!` when a
# second mode claims a BufferKind that's already bound — first
# registration wins, the duplicate claim is logged for debugging.
tracing = { workspace = true }

[dev-dependencies]
# M-async.2: registry tests are `#[tokio::test]` so they can
# `.await` on the bus channel that the spawned lifecycle task
# publishes to. `tokio::sync::mpsc` for the channel; the
# `macros` feature for `#[tokio::test]`; `rt` for the test
# runtime; `time` for `tokio::time::sleep` used by the cascade
# rollback tests (registry.rs:1436).
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
