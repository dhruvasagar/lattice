[package]
name = "lattice-multibuffer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# M.2.b.1 (2026-05-31): dedicated crate for every multibuffer
# concern (data model, major mode, motions, header / fold
# providers). Host depends on this crate to wire boot
# registration; host has no other multibuffer-specific code.
# See `docs/dev/architecture/multibuffer-views.md` §3.6.

[dependencies]
lattice-protocol = { path = "../lattice-protocol" }
lattice-core = { path = "../lattice-core" }
lattice-grammar = { path = "../lattice-grammar" }
lattice-runtime = { path = "../lattice-runtime" }
lattice-mode = { path = "../lattice-mode" }
lattice-cells = { path = "../lattice-cells" }
# T.7 (2026-06-18): the mode registers its own theme elements
# (`multibuffer.excerpt_header[.path|.count]`) and the excerpt-
# header provider resolves+bakes them into the header VirtualRow
# bg/fg. `lattice-theme` is a leaf crate (arc-swap + tracing only),
# so this adds no transitive weight. Proves the mode-owned
# element-registration path end-to-end (extensibility acid test).
lattice-theme = { path = "../lattice-theme" }
# K.4.7 (2026-06-07): per-excerpt syntax highlighting.
lattice-syntax = { path = "../lattice-syntax" }
lattice-config = { path = "../lattice-config" }
arc-swap = { workspace = true }
thiserror = { workspace = true }
# M.2.b.2 (2026-06-01): mode.rs spawns a `DocumentClosed`
# cleanup task; view.rs logs missing-service warnings.
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
tracing = { workspace = true }
# M.4 (2026-06-01): `register_event!` macro expands into a
# `#[linkme::distributed_slice(...)]` static — every crate that
# uses the macro needs `linkme` as a direct dep (the macro can't
# route through a re-export).
linkme = { workspace = true }
# M.6 (2026-06-01): `providers::search` walks the filesystem
# with respect for .gitignore / .git/info/exclude / .ignore.
# Feature-gated so opt-out builds don't pull the dep tree.
ignore = { workspace = true, optional = true }
# M.6.3 (2026-06-01): regex matcher for `ProjectSearchOptions::regex`.
# Workspace already uses fancy-regex for lookaround/backref
# support in other call sites; same dep here so the regex
# dialect is uniform across the editor.
fancy-regex = { workspace = true, optional = true }

[features]
# M.6 (2026-06-01): each in-tree provider ships behind its own
# cargo feature so opt-out builds disable per provider. Default
# enables the providers we ship.
default = ["search"]
search = ["dep:ignore", "dep:fancy-regex"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "time", "macros", "rt-multi-thread"] }
# M.2.c (2026-06-01): criterion-driven multibuffer benches —
# excerpt-jump motion latency, view compose latency, translation
# rebuild latency. CI gates per `multibuffer-views.md` §7.
criterion = { workspace = true }

[[bench]]
name = "multibuffer_motion"
harness = false

[[bench]]
name = "multibuffer_compose"
harness = false

# M.6.1 (2026-06-01): project_search_first_batch_p99_ms.
[[bench]]
name = "project_search"
harness = false
required-features = ["search"]

# M.6.X (2026-06-01): companion bench to
# `tests/ui_responsive_during_scan.rs`. Tracks the worst
# probe-gap on a current_thread runtime while a 1k-file scan
# runs concurrently. The bench number IS the paramount-goal-1
# property: keystroke-pipeline latency at the runtime layer
# during provider load. Pre-M.6.X: hundreds of ms (freeze).
# Post-M.6.X: stays close to the 5 ms sleep budget.
[[bench]]
name = "actor_latency_during_scan"
harness = false
required-features = ["search"]

[lints]
workspace = true
