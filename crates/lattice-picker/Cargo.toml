[package]
name = "lattice-picker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lattice-completion = { path = "../lattice-completion" }
lattice-grammar = { path = "../lattice-grammar" }
lattice-core = { path = "../lattice-core" }
lattice-protocol = { path = "../lattice-protocol" }
tokio = { workspace = true, features = ["sync"] }
serde = { workspace = true, features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
dirs = { workspace = true }
# `register_event!` expands to a `#[linkme::distributed_slice]`
# attribute and the proc-macro path can't route through
# re-exports -- caller crates must declare `linkme` as a
# direct dep.
linkme = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "picker"
harness = false

[lints]
workspace = true
