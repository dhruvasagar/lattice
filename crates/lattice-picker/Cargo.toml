[package]
name = "lattice-picker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Build-time: this crate has no doc examples, and `cargo test -p <crate>`
# still compiles + links a doctest binary for it regardless. Measured at
# ~100s of "merged doctests compilation" on a comparable crate, paid on
# every test invocation. Turn it back on the moment a `///  ```rust`
# example lands here — the point is to stop paying for nothing, not to
# discourage examples.
doctest = false

[dependencies]
lattice-completion = { path = "../lattice-completion" }
lattice-grammar = { path = "../lattice-grammar" }
lattice-core = { path = "../lattice-core" }
lattice-protocol = { path = "../lattice-protocol" }
# Slice 5.7.B.0: first-party sources read picker.grep.backend
# (and other `picker.*` typed options) via ConfigRegistry.
# No cycle: lattice-config depends on grammar/core/completion,
# none of which touch picker.
lattice-config = { path = "../lattice-config" }
tokio = { workspace = true, features = ["sync"] }
# PL8.B: the runtime-mutable registry handle (`PickerRegistryHandle`) is
# `Arc<ArcSwap<PickerRegistry>>` — wait-free reads, copy-on-write RCU writes for
# runtime plugin-source registration (the snippet-registry idiom).
arc-swap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
dirs = { workspace = true }
# `register_event!` expands to a `#[linkme::distributed_slice]`
# attribute and the proc-macro path can't route through
# re-exports -- caller crates must declare `linkme` as a
# direct dep.
linkme = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# TR.2: drive a `TransientBuildFuture` to completion in the registry's
# unit tests. Test-only — the crate itself only *stores* the future; the
# host owns the runtime that polls it.
futures = { workspace = true }
# PH.3: test-only — construct `DisplaySpan { style: lattice_cells::Style }`
# in the grep-highlighter wiring test. NOT a production dep: the picker
# crate stays free of syntax/cells in its dependency graph (the
# structural off-thread guarantee).
lattice-cells = { path = "../lattice-cells" }

[[bench]]
name = "picker"
harness = false

[lints]
workspace = true
