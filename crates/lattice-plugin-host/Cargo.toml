[package]
name = "lattice-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Phase 7: the WASM Component Model extension substrate. Design:
# docs/dev/architecture/plugin-host.md. Slice plan:
# docs/dev/operations/slice-plans/plugin-host.md.
#
# PH7.0 scaffolded the engine + `bindgen!` + compile/instantiate. PH7.1a
# adds the async runtime core: async lifecycle exports, per-call fuel + epoch
# budgets, and a background epoch-ticker. The lib owns no async runtime --
# methods are `async fn`, so the caller (the editor's multi-thread pool)
# drives them; `tokio` is a dev-dependency only, for the tests. No WASI view
# yet (PH7.2); on-disk module cache + lazy instantiation land in PH7.1b.

[lib]
# Build-time: this crate has no doc examples, and `cargo test -p <crate>`
# still compiles + links a doctest binary for it regardless. Measured at
# ~100s of "merged doctests compilation" on a comparable crate, paid on
# every test invocation. Turn it back on the moment a `///  ```rust`
# example lands here — the point is to stop paying for nothing, not to
# discourage examples.
doctest = false

[dependencies]
# The runtime + Component Model + Cranelift AOT. Default features carry the
# component-model + cranelift + wat stack; feature-trimming for build time
# is a later optimization, not a scaffold concern.
wasmtime = { workspace = true }
# PH7.2: the per-plugin WASI (preview2) view. Each plugin's `Store` is built
# with exactly its granted `wasi:filesystem`/`wasi:cli` capabilities, so a
# plugin without an `fs:write` grant cannot reach a path outside its data dir
# at the WASI layer -- enforced by the runtime, not by discipline.
wasmtime-wasi = { workspace = true }
# Typed host error surface (no panics on any path -- the four-artefact
# graceful-error clause). `anyhow::Error` is wasmtime's error type; we carry
# it as the `#[source]` of each stage-specific variant.
thiserror = { workspace = true }
anyhow = { workspace = true }
# PH7.1b: cross-platform cache-dir resolution (XDG on Linux, Application
# Support on macOS, LocalAppData on Windows) for the default on-disk module
# cache location, `<cache>/lattice/plugin-cache/`. PH7.2 reuses it for the
# default per-plugin data-dir base, `<data>/lattice/plugins/`.
dirs = { workspace = true }
# PH7.2: the plugin manifest is a committed TOML format (id + requested OS
# capabilities + editor capabilities); `serde` derives the model, `toml`
# parses the file. The Phase-8 plugin manager will discover + parse it; the
# host consumes the already-parsed `PluginManifest`.
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# PH7.2 provenance: the host stamps `SourceLayer::Plugin(id)` for every plugin
# contribution from its own ground truth (a plugin cannot forge provenance --
# `source.rs` has no public `SourceLocation` setter). The numeric plugin id is
# host-issued; this crate is the "plugin host bridge" `source.rs` names.
lattice-grammar = { path = "../lattice-grammar" }
# PH7.2 editor capabilities: the manifest's `editor_capabilities` parse into
# the same `CapabilitySet` `Mode::required_capabilities` returns, so a
# plugin-declared mode's capability requirements are typed from day one
# (enforcement stays the mode-activation path; this slice only sizes the
# manifest honestly per fragment §6).
lattice-mode = { path = "../lattice-mode" }
# PH7.3a boundary mirrors: `PickerAcceptOutcome` (lattice-picker) and
# `RawCandidate` / `CandidateData` / `CandidateKind` (lattice-completion) are
# among the exercised types the WIT mirror round-trips (fragment §4 exit).
lattice-picker = { path = "../lattice-picker" }
# CR.4: `WasmDashboardSection` IS a `lattice_dashboard::DashboardSection`, so
# the registry treats a plugin section and a builtin identically. A leaf crate
# (config/grammar/mode/theme/cells) — no cycle.
lattice-dashboard = { path = "../lattice-dashboard" }
lattice-completion = { path = "../lattice-completion" }
# PH7.3b Effect payload mirrors: Position/Range/Edit/Selection/SelectionSet
# (lattice-protocol) and AppliedEdit/BufferId (lattice-core) are the nested
# payload types the `effect` variant composes.
lattice-protocol = { path = "../lattice-protocol" }
lattice-core = { path = "../lattice-core" }
# PO.1 (plugin observability): `trace::PluginTracePushed` is a typed event
# declared via `lattice_protocol::register_event!`, whose expansion registers an
# `#[linkme::distributed_slice]` descriptor — so the invoking crate needs linkme
# in scope (the `lattice-lsp` `LspLogPushed` precedent).
linkme = { workspace = true }
# PH7.3c: the `document` resource is backed by `Arc<DocumentSnapshot>` (decision
# A -- a point-in-time immutable view; `get-text-range` slices this snapshot's
# rope). `DocumentSnapshot` lives in lattice-runtime.
lattice-runtime = { path = "../lattice-runtime" }
# TS.1: the tree-sitter seam. The host publishes each buffer's immutable
# `SyntaxSnapshot` to a plugin (read-only) as a `tree-snapshot` resource; the
# trampoline downcasts the type-erased snapshot the grammar `ActionContext`
# carries and mints navigable `node` handles backed by `tree_sitter::Node`
# (consumer side — `lattice-host` is the builder). `tree-sitter` is named
# directly to operate on the snapshot's `Tree` / `Node` / `Point`.
lattice-syntax = { path = "../lattice-syntax" }
# TC.2: `ContextScope` — the native type the `context` seam's boundary converts
# to. Already in the graph via `lattice-mode`; named directly because
# `boundary_context.rs` implements `WitBoundary` for it (a foreign type would
# make that impl illegal from here, and the native type belongs beside the
# resolver that consumes it, not duplicated in the plugin host).
lattice-cells = { path = "../lattice-cells" }
# TC.4: the `theme` seam registers plugin elements into the SAME registry
# builtins use, so the host names the registry + `StyleSpec` directly.
lattice-theme = { path = "../lattice-theme" }
# CM.6b: the `error-parser` seam's native side. `WasmErrorParser` implements
# `lattice_compilation::CompilationParser` and `WasmErrorParserFactory`
# implements `CompilationParserFactory`, so a plugin parser is
# indistinguishable from a native one downstream. Same shape as the picker /
# completion / theme edges above: the host names the native registry crate its
# seam contributes into (a foreign-type impl would otherwise be illegal here).
lattice-compilation = { path = "../lattice-compilation" }
tree-sitter = { workspace = true }
# TS.2: tree-sitter 0.24's `QueryMatches` is a `StreamingIterator` (borrows the
# cursor per step) — needed to iterate `run-query` matches host-side.
streaming-iterator = { workspace = true }
# PH7.10: the config/options seam. Plugin options register into the SAME
# `ConfigRegistry` core options use, built as `Option<bool|i64|String>` via the
# public `OptionType` parse/format contract (no new registry variant).
lattice-config = { path = "../lattice-config" }
# PH7.8: the event/hook seam. `EventFilter.major_modes` is `Vec<ModeId>` and the
# native `EventFilter` / `SubscriptionTarget` live in `lattice-runtime`; a
# plugin's declarative filter reconstructs `ModeId` from its string form, so the
# `ModeId` type is named directly (already a transitive dep via grammar/mode).
lattice-keymap = { path = "../lattice-keymap" }
# PH7.2: graceful-degradation logging -- a denied/inaccessible granted prefix
# is skipped with a `warn!`, never a panic or a failed load.
tracing = { workspace = true }
# PH7.4c.1b: the per-plugin actor bridge (`picker_task`). `futures::channel`
# gives runtime-agnostic mpsc + oneshot for the request/reply protocol, so the
# lib stays executor-agnostic -- the caller spawns the returned actor future on
# its own multi-thread runtime (the lib owns no runtime; `tokio` remains a
# dev-dependency only). Chosen over `tokio::sync` to keep that invariant.
futures = { workspace = true }
# OC.4: `local-utc-offset-seconds`. A guest has `wasi:clocks` (UTC) and no `TZ`
# (the host builds its `WasiCtxBuilder` with no environment inheritance), so it
# cannot work out the user's offset — the host has to answer. See the workspace
# manifest for why chrono rather than `time`, and `host-services.wit` for why
# the seam is not capability-gated.
chrono = { workspace = true }

[dev-dependencies]
# TR.2b: the transient boundary tests build a `CommandRegistryHandle` (an
# `Arc<ArcSwap<CommandRegistry>>`) to resolve row command names against.
# Dev-only — the lib takes the handle from its caller and never constructs one.
arc-swap = { workspace = true }
# Assembles the hand-written lifecycle components (no-op / busy / spin) from
# WebAssembly Text to component bytes inside the tests -- no wasm32-wasip2
# target or separate guest build for the scaffold.
wat = { workspace = true }
criterion = { workspace = true }
# The tests drive the async lifecycle exports and exercise parallelism /
# off-actor-thread execution, so they own the runtime (the lib does not).
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
# Hermetic per-test dir for the module-cache hit/miss test.
tempfile = { workspace = true }
# CR.3: `tests/help_source.rs` asserts the fixture's colliding topic name is a
# REAL builtin, so the namespacing test cannot pass by colliding with nothing.
# Dev-only — the crate itself never depends on lattice-help (see help_host.rs).
lattice-help = { path = "../lattice-help" }
# PH7.8b.3: the e2e test acts as a cross-plugin CONSUMER — it shares the guest's
# `PluginEvent` type (via the SDK derive) and decodes the emitted payload,
# proving the contract round-trips guest→host.
lattice-plugin-sdk = { path = "../lattice-plugin-sdk" }
serde = { workspace = true }
# PH7.12c: property fuzz of the untrusted-input boundaries (component bytes,
# manifest TOML) — assert graceful degradation (typed error, never a panic)
# across randomised inputs.
proptest = { workspace = true }

[[bench]]
name = "instantiate"
harness = false

[[bench]]
name = "boundary"
harness = false

# PH7.3d: the end-to-end guest↔host typed-call bench (the §7 <500ns headline,
# deferred from 3a to where a real guest call exists). Skips when the
# wasm32-wasip2 fixture wasn't built (see build.rs).
[[bench]]
name = "trampoline"
harness = false

# PH7.6: warm completion `generate` through the CompletionClient bridge (channel
# + guest export + candidate marshalling, no walk). Skips without the wasm target.
[[bench]]
name = "completion"
harness = false

# PH7.7a: grammar-extension boundary marshalling — context projection +
# result/effect `from_wit` (the < 5µs grammar round-trip budget's marshalling
# component; the end-to-end guest↔host trampoline gate lands with PH7.7c/d).
[[bench]]
name = "grammar"
harness = false

# PH7.7d: grammar-extension end-to-end round-trip — a plugin motion dispatched
# through the sync trampoline (project → sync guest call → from_wit). The
# descriptive companion to the `grammar_round_trip` ratchet (§7 < 5µs p99). Skips
# without the wasm target.
[[bench]]
name = "grammar_roundtrip"
harness = false

# PO.3: the hot-path grammar-trace gate — the same motion round-trip untraced vs.
# trace-off (default gate) vs. trace-debug. Pins that instrumentation adds ≈0 to
# the keystroke path when off (design §4). Skips without the wasm target.
[[bench]]
name = "grammar_trace_gate"
harness = false

# TS.1: the sync on-keystroke tree query (`enclosing`) — pins that it does no
# parsing and is a bounded ancestor walk, inside the grammar Reflex budget.
[[bench]]
name = "tree_enclosing"
harness = false

# OT.3: the agenda `scan-input` trade — the per-file parse the host now pays
# against the per-file text copy it no longer sends across the boundary. The
# slice plan (D3) says the net must be measured rather than assumed, because
# parsing is slower than a line scan and the agenda is a producer critical path.
[[bench]]
name = "agenda_scan_input"
harness = false

# CR.4: the actor-thread guest call a plugin dashboard section costs per
# compose, plus its one-time spawn. The design fragment argues the call is
# acceptable because composition is Display-class; this is the number that
# makes the argument falsifiable.
[[bench]]
name = "dashboard_section"
harness = false

[lints]
workspace = true
