# OM.A1 agenda fixture guest — a minimal `wasm32-wasip2` component
# implementing the `scanned-excerpt-source-plugin` world. It declares one extension,
# keeps per-scan state across `scan` calls (so the host test can prove `begin`
# actually clears it), and errs on a file it considers malformed (so the
# skip-and-continue path is exercised against a real guest rather than a mock).
# Built to a component by the host crate's build.rs and loaded by
# `tests/agenda_source.rs`. Standalone workspace (`[workspace]` below) so it is
# NOT part of the parent workspace — it targets wasm32-wasip2 and must not
# inherit the host toolchain's lints/target. Mirrors the sibling `media-guest`
# fixture's setup exactly.
[package]
name = "agenda-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"

[profile.release]
opt-level = "s"
strip = true

[workspace]
