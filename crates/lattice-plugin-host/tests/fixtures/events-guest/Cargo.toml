# PH7.8c event fixture guest — a minimal `wasm32-wasip2` component implementing
# the `events-plugin` world: from its `register-events` export it subscribes a
# few handlers via the imported `events` API; its `on-event` export appends each
# received event's kind to `/data/received.log` (its writable data-dir mount,
# PH7.2) so the host test can observe delivery end to end. A poison handler traps
# deliberately to exercise the graceful-skip path (§8). Built to a component by
# the host crate's build.rs and loaded by `tests/event_source.rs`.
# Standalone workspace (`[workspace]` below) so it is NOT part of the parent
# workspace — it targets wasm32-wasip2 and must not inherit the host toolchain's
# lints/target. Mirrors the sibling `grammar-guest` fixture's setup exactly.
[package]
name = "events-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
# PH7.8b.3: the guest-side SDK — `#[derive(PluginEvent)]` for a type-safe event
# over the opaque wire. Path-deps a parent-workspace crate (the SDK is
# WIT-agnostic pure serde, so it compiles fine to wasm32-wasip2).
lattice-plugin-sdk = { path = "../../../../lattice-plugin-sdk" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
strip = true

[workspace]
