[package]
name = "lattice-plugin-loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Phase 8 (PL8.A): the editor-side plugin loader. Phase 7 shipped the plugin
# *runtime* (`lattice-plugin-host`) as a substrate-neutral "engine + seams"
# crate that knows nothing about the editor. This crate is the SUBSYSTEM that
# composes the runtime with the editor's native registries -- discovery, load
# orchestration (compile -> instantiate -> activate -> drain each seam into its
# registry), the loaded-plugin state, and the user-facing load/unload/reload
# surface. It installs through the same `SubsystemBoot` seam every other
# subsystem uses (`lattice_plugin_loader::install(&mut boot)`), so wiring it
# into the host adds ZERO `Editor::` methods (the mode-ownership acid test).
#
# Design: docs/dev/architecture/plugin-host.md (Sec.5 seam->registry drain,
# Sec.8 lifecycle) + docs/dev/architecture/boot-composition.md (the install
# contract). Slice plan: docs/dev/operations/slice-plans/plugin-loader.md.

[lib]
# Build-time: this crate has no doc examples, and `cargo test -p <crate>`
# still compiles + links a doctest binary for it regardless. Measured at
# ~100s of "merged doctests compilation" on a comparable crate, paid on
# every test invocation. Turn it back on the moment a `///  ```rust`
# example lands here — the point is to stop paying for nothing, not to
# discourage examples.
doctest = false

[dependencies]
# WT.2b: the canonical `wit/` package, written into a plugin source immediately
# before the build service invokes cargo on it. The binary that writes the API
# definition is then the very one about to instantiate the component, so the two
# cannot disagree — which is the failure this exists to make unreachable.
#
# Zero-dependency by construction (see the crate's own manifest), so taking it
# here costs the loader nothing in build graph or link size.
lattice-wit = { path = "../lattice-wit" }
# PM.6: `Prebuilt{url}` source downloads.
ureq = { workspace = true }
# The Phase-7 runtime: the wasmtime engine, the WIT API, the capability/fuel/
# crash model, and every extension seam. PL8.A drives its lifecycle spine
# (`compile` / `instantiate_plugin` / `activate`); PL8.B spawns its seam actors.
lattice-plugin-host = { path = "../lattice-plugin-host" }
# The `SubsystemBoot` install surface (below every subsystem crate; naming the
# host's concrete `BootContext` would be a dependency cycle). The loader reaches
# the runtime pool + native registries through this trait, never the host.
lattice-mode = { path = "../lattice-mode" }
# The native picker registry the loader RCU-registers a loaded picker plugin's
# source into (`PickerRegistryHandle` / `WasmPickerSource` → `Arc<dyn
# PickerSourceGenerator>`).
lattice-picker = { path = "../lattice-picker" }
# `EventBus` — `spawn_picker_source` binds the seam actor's crash quarantine to
# the bus (a plugin trap fires `PluginCrashed`, host stays live).
lattice-runtime = { path = "../lattice-runtime" }
# The config registry (already interior-mutable) that config plugins register
# their typed options into via `spawn_config_plugin`.
lattice-config = { path = "../lattice-config" }
# A completion plugin's `WasmCompletionSource` is wrapped as a
# `CompletionSourceContribution` (`CompletionSourceKind::Async`) and carried by a
# loader-contributed universal minor mode's `completion_sources()`, so the native
# aggregator picks it up like any LSP / snippet source (option A).
lattice-completion = { path = "../lattice-completion" }
# The runtime-mutable command registry (`CommandRegistryHandle =
# Arc<ArcSwap<CommandRegistry>>`, B3a/B3b) a grammar plugin's motions / operators
# / text-objects / ex-commands RCU-register into via `instantiate_grammar_plugin`
# → `GrammarContributionSet::register_all`. The sync-trampoline seam, so the
# registry owns the guest store (no actor task) and the dispatcher fires it on
# keystroke off a wait-free `.load()` snapshot.
lattice-grammar = { path = "../lattice-grammar" }
# The interior-mutable keymap handle (`KeymapHandle`, Arc-backed + Clone) a mode
# plugin's per-mode `MinorMode` keymap bindings land in via `spawn_mode_plugin`.
# Shared (not RCU'd): its writes are internally mutex+ArcSwap-routed, so a `&`
# ref mutates it; the loader captures a clone from the boot service.
lattice-keymap = { path = "../lattice-keymap" }
# PL8.H.1: `Event` / `EventKind` — the loader subscribes to `PluginCrashed` to
# track per-plugin health for the manager view (`subscribe_health`). A leaf crate
# already in the graph (via `lattice-runtime`); named directly now the loader
# constructs an `EventFilter::kind(EventKind::PluginCrashed)` + matches `Event`.
lattice-protocol = { path = "../lattice-protocol" }
# TC.4: the theme seam's drain hands the plugin the SAME registry builtins use.
lattice-theme = { path = "../lattice-theme" }
# CR.3: the `help` seam's drain builds `HelpTopic`s from the plain specs the
# host hands back and RCU-registers them into the SAME registry the builtin
# docs live in. The host crate deliberately does NOT depend on this — a help
# body is inert data on both sides of the boundary, so the conversion belongs
# on the editor-facing side.
lattice-help = { path = "../lattice-help" }
# LG.3c: the `language` seam's drain compiles the guest's grammar bytes into a
# `tree_sitter::Language` and registers it in the SAME registry the bundled
# languages live in. Same boundary argument as `help` above — the host crate
# hands back plain bytes and query strings and deliberately does not depend on
# this; compiling the grammar (~100 ms of Cranelift) belongs on the
# editor-facing side, after the guest's store has been dropped.
lattice-syntax = { path = "../lattice-syntax" }
# CR.4: the `dashboard` seam's drain RCU-registers the host's
# `WasmDashboardSection`s into the SAME registry the builtin sections live in.
lattice-dashboard = { path = "../lattice-dashboard" }
# PR.6: `ProjectResolverHandle` — the loader hands the host the resolver the
# guest `project` seam answers from. A leaf crate already in the graph; named
# directly now `install` looks the service up by that exact alias.
lattice-core = { path = "../lattice-core" }
# CM.6b: the compilation parser-factory registry an `error-parser` plugin's
# `WasmErrorParserFactory` RCU-registers into. Each compilation pipe reader
# mints its own parser from it at the start of a run.
lattice-compilation = { path = "../lattice-compilation" }
# The shared runtime handle the loader drives seam actors + off-boot discovery
# on (never the current-thread editor actor).
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
# Cross-platform plugins-dir resolution (`<data>/lattice/plugins/`, XDG on
# Linux / Application Support on macOS / LocalAppData on Windows).
dirs = { workspace = true }
# Filesystem watcher for the init-artifact auto-reload (PL8.D.4): watch
# `<config>/lattice/init/init.wasm` and `:reload-config` when a rebuild rewrites
# it. Same crate the LSP `didChangeWatchedFiles` watcher uses.
notify = { workspace = true }
# Typed load-error surface (no panics on any load path -- the four-artefact
# graceful-error clause; a bad plugin is logged + skipped, never fatal).
thiserror = { workspace = true }
# One-shot user-actionable load events ("plugin loaded") + degraded-load warns.
tracing = { workspace = true }

[dev-dependencies]
# Drives the async lifecycle spine (`instantiate_plugin` / `activate` are
# `async fn`; the lib owns no runtime, so the test does).
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
# Assembles the no-op lifecycle fixture (`plugin`-world component) from WAT to
# component bytes for the spine proof -- the same canonical fixture the runtime
# crate's lifecycle tests use, referenced in place (single source of truth).
wat = { workspace = true }
# The picker-drain e2e builds a fresh `ArcSwap<PickerRegistry>` + a hermetic
# plugins dir; the grammar-drain e2e builds a fresh `ArcSwap<CommandRegistry>`.
arc-swap = { workspace = true }
tempfile = { workspace = true }
# The grammar-drain e2e dispatches a loaded plugin motion through the real
# grammar dispatcher (`execute_motion_only`) against a `Buffer` at a `Position`,
# proving the sync trampoline fires off the wait-free registry snapshot (B3b).
lattice-core = { path = "../lattice-core" }
lattice-protocol = { path = "../lattice-protocol" }
# AP.3: the auto-pair manual-style e2e injects a pre-parsed tree snapshot on the
# per-dispatch env (the tree-sitter seam's scope query), mirroring what the host's
# Action gate does with the active buffer's `SyntaxHandle::snapshot()`.
lattice-syntax = { path = "../lattice-syntax" }
# TC.10: the bundled `@context` queries are compiled against the real grammars
# so a bad field name fails a test rather than silently disabling the strip for
# one language.
tree-sitter = { workspace = true }
