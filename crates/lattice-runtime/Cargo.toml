[package]
name = "lattice-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Build-time: this crate has no doc examples, and `cargo test -p <crate>`
# still compiles + links a doctest binary for it regardless. Measured at
# ~100s of "merged doctests compilation" on a comparable crate, paid on
# every test invocation. Turn it back on the moment a `///  ```rust`
# example lands here — the point is to stop paying for nothing, not to
# discourage examples.
doctest = false

[dependencies]
lattice-protocol = { path = "../lattice-protocol" }
lattice-cells = { path = "../lattice-cells" }
lattice-core = { path = "../lattice-core" }
lattice-grammar = { path = "../lattice-grammar" }
# EF.1: `EventFilter.major_modes` is keyed by `ModeId`, which lives
# in `lattice-keymap` (interned-string mode identity; keymap has no
# upstream dep on the runtime, so this adds no cycle).
lattice-keymap = { path = "../lattice-keymap" }
# EF.1: `EventFilter.path_glob` compiles its patterns through
# `glob::compile_glob_set`; `globset` runs N patterns in one pass.
globset = { workspace = true }
tokio = { workspace = true }
arc-swap = { workspace = true }
thiserror = { workspace = true }
# `register_event!` (used by `messages` + tests) expands to a
# `#[linkme::distributed_slice]` entry, so caller crates must
# declare linkme as a direct dep -- lattice-protocol
# re-exports the attribute macro but the path lookup still
# resolves through the caller's manifest.
linkme = { workspace = true }
# msg-mode.1: `MessagesLayer` (tracing::Layer impl) bridges
# every `tracing::*` event into `MessagesRing` + the typed
# event bus so `*messages*` is the unified observability
# surface (design.md §5.10.6). `tracing` itself is already a
# transitive dep via `lattice-grammar`'s EchoLevel ↔
# tracing::Level impls; `tracing-subscriber` is the heavier
# add for the Layer trait + Registry.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "time"] }
criterion = { workspace = true }
# Benches build a `CommandRegistryHandle`
# (`Arc<ArcSwap<CommandRegistry>>`) to hand to `spawn_document`,
# which took a bare `Arc<CommandRegistry>` before the handle
# migration. Dev-only: the crate itself never names arc-swap.
arc-swap = { workspace = true }

[[bench]]
name = "actor"
harness = false

# EF.1: publish dispatch stays O(subscribers-of-kind) -- the
# reserved filter fields (path_glob / major_modes / predicate)
# add a per-candidate constant check, they do not widen the scan.
[[bench]]
name = "event_filter"
harness = false

[lints]
workspace = true
