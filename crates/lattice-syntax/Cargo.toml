[package]
name = "lattice-syntax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# Build-time: this crate has no doc examples, and `cargo test -p <crate>`
# still compiles + links a doctest binary for it regardless. Measured at
# ~100s of "merged doctests compilation" on a comparable crate, paid on
# every test invocation. Turn it back on the moment a `///  ```rust`
# example lands here — the point is to stop paying for nothing, not to
# discourage examples.
doctest = false

[dependencies]
arc-swap = { workspace = true }
# H.2 (2026-08-29): conceal-rule patterns. `regex`, NOT `fancy-regex`:
# these run against every rebuilt display line and come from a plugin,
# so an engine that can backtrack would be a plugin's ability to freeze
# the renderer. See `conceal.rs`.
regex = { workspace = true }
# H.2: the registration-time refusal log for a bad conceal rule.
tracing = { workspace = true }
lattice-cells = { path = "../lattice-cells" }
lattice-config = { path = "../lattice-config" }
lattice-core = { path = "../lattice-core" }
# N.1.4b (2026-06-10): `impl lattice_grammar::ScopeResolver for
# SyntaxSnapshot` bridges the syntax tree into the grammar
# dispatcher's tree-sitter text-object resolution (af/ac/aa/al).
# The dependency points syntax -> grammar (not the reverse), so
# lattice-grammar stays tree-sitter-agnostic.
lattice-grammar = { path = "../lattice-grammar" }
# CSM.6: tree-sitter-completion-mode owns the local-symbol
# completion source. lattice-mode is already a dep (for the
# language major modes); lattice-completion provides the
# source trait surface. Edge to lattice-completion already
# exists transitively (lattice-mode -> lattice-completion);
# direct dep makes the import path explicit.
lattice-completion = { path = "../lattice-completion" }
lattice-mode = { path = "../lattice-mode" }
lattice-protocol = { path = "../lattice-protocol" }
# DX.2 (BC.6 diff extraction): the syntax->theme-element style bridge
# (`resolve_syntax_style` / `syntax_element_id`) moves here from
# `lattice-host` so `lattice-diff` can reach it without the host. The
# bridge is syntax-aware (takes a `lattice_syntax::Style`), so it lives
# in this higher crate depending DOWN on the `lattice-theme` leaf —
# keeping `lattice-theme` a minimal renderer-hot-path leaf. Cycle-free:
# `lattice-theme` deps only arc-swap + tracing.
lattice-theme = { path = "../lattice-theme" }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tree-sitter = { workspace = true }
streaming-iterator = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-md = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-ruby = { workspace = true }
tree-sitter-html = { workspace = true }
tree-sitter-css = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-yaml = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-wit = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-sequel = { workspace = true }
tree-sitter-lua = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# LG.3b: the end-to-end test registers the markdown grammar's own
# injections query so a WASM-backed parent injects into a NATIVE child —
# the shape org needs for `#+BEGIN_SRC rust`. Already a normal dependency
# of this crate; integration tests cannot see those, hence the repeat.
tree-sitter-md = { workspace = true }
tree-sitter-json = { workspace = true }

[[bench]]
name = "highlight"
harness = false

[[bench]]
name = "scope_toward"
harness = false

# LG.2. `detect_from_path` gained a runtime-registry fallthrough and has
# nineteen call sites, one of them per-hunk in magit's diff highlighting.
[[bench]]
name = "lang_detect"
harness = false

# LG.1. The wasm runtime is unconditional as of LG.3b, so this needs no
# feature flag — only the built artefact (scripts/build-wasm-grammar.sh).
[[bench]]
name = "wasm_vs_native_parse"
harness = false

[lints]
workspace = true
