[package]
name = "lattice-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Terminal state machine + grid (T1, 2026-05-22). alacritty_terminal
# is the VT/xterm parser + cell-grid library extracted from
# alacritty — pure Rust, battle-tested (alacritty, Zed, neovide).
# NOT alacritty the app — does not read alacritty config.
alacritty_terminal = "0.26"
# T3.b (2026-05-25): the SharedTerm search helper compiles
# user-provided patterns; same regex engine the document path
# uses so `\v` / `\c` / etc. behave identically across buffer
# kinds.
fancy-regex = { workspace = true }
# Cross-platform PTY: Unix forkpty + macOS forkpty + Windows
# ConPTY behind one trait. Spawns the child + returns Read/Write
# halves of the master fd.
portable-pty = "0.9"
parking_lot = "0.12"
tokio = { workspace = true }
arc-swap = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
lattice-core = { path = "../lattice-core" }
lattice-runtime = { path = "../lattice-runtime" }
lattice-protocol = { path = "../lattice-protocol" }
# T1 follow-up: `TerminalMode` contributes typed options
# (ReadOnly + NoFile via OptionOverrideSet) so the substrate
# names both `lattice-config` (for the option types) and
# `lattice-mode` (for the Mode trait + registry).
lattice-config = { path = "../lattice-config" }
lattice-mode = { path = "../lattice-mode" }

# 2026-05-25: SIGKILL the child on TerminalBuffer::Drop so the
# reader's blocking read() returns and the editor can exit
# cleanly. portable-pty's default ChildKiller sends SIGHUP which
# isn't sufficient on every shell / environment (WSL2, captured
# stty, etc.); SIGKILL via libc::kill(pid, SIGKILL) is the
# guaranteed wake.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
