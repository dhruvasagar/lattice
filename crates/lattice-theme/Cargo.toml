[package]
name = "lattice-theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Renderer-neutral theme primitives: the `Color` / `Style` /
# `Modifiers` / `NamedColor` value types + the rich-vocabulary
# attribute types (`FontScale` / `Weight` / `FamilyId`) + the
# `parse_color` helper. A LEAF crate — depends on no other
# workspace crate — so every layer above (cells, mode, host, both
# renderers) can share one definition of a style.
#
# T.1 (theme-system slice plan): these types moved here out of
# `lattice-host/src/ui/theme.rs`; host re-exports them from their
# old path (`lattice_host::ui::theme`) so existing call sites are
# unchanged. The element registry + palette + resolution (T.2/T.3)
# land in this crate next; the host's `Theme` struct + `syntax_style`
# stay in host until the consumer-migration thread (T.4+).
#
# Design: docs/dev/architecture/theme-system.md.

[lib]
# Build-time: this crate has no doc examples, and `cargo test -p <crate>`
# still compiles + links a doctest binary for it regardless. Measured at
# ~100s of "merged doctests compilation" on a comparable crate, paid on
# every test invocation. Turn it back on the moment a `///  ```rust`
# example lands here — the point is to stop paying for nothing, not to
# discourage examples.
doctest = false

[dependencies]
# T.2: lock-free read of the resolved-style table. The registry
# publishes `ResolvedTheme` via `ArcSwap` so renderers read
# `resolved.get(id)` without a lock on the hot path.
arc-swap = { workspace = true }
# T.2: resolution logs (never swallows) on an unknown palette key /
# inherit cycle. Rare, theme-build-time only — `warn!` is correct
# (user-actionable, not per-frame).
tracing = { workspace = true }

[lints]
workspace = true
