[package]
name = "lattice-ui-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lattice-protocol = { path = "../lattice-protocol" }
lattice-mode = { path = "../lattice-mode" }
lattice-core = { path = "../lattice-core" }
lattice-grammar = { path = "../lattice-grammar" }
lattice-completion = { path = "../lattice-completion" }
lattice-picker = { path = "../lattice-picker" }
lattice-config = { path = "../lattice-config" }
lattice-snippet = { path = "../lattice-snippet" }
lattice-syntax = { path = "../lattice-syntax" }
lattice-runtime = { path = "../lattice-runtime" }
lattice-lsp = { path = "../lattice-lsp" }
lattice-help = { path = "../lattice-help" }
lattice-oil = { path = "../lattice-oil" }
lattice-file-tree = { path = "../lattice-file-tree" }
lsp-types = { workspace = true }
tokio = { workspace = true }
tree-sitter = { workspace = true }
streaming-iterator = { workspace = true }
fancy-regex = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
arc-swap = { workspace = true }
# `register_event!` expands to a `#[linkme::distributed_slice]`
# entry; caller crates that invoke the macro must declare
# linkme as a direct dep (lattice-protocol re-exports the
# attribute macro but the path lookup still resolves through
# the caller's manifest).
linkme = { workspace = true }
unicode-width = "0.2"
anyhow = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "test-util", "time"] }
criterion = { workspace = true }

[[bench]]
name = "folds"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "keymap"
harness = false

[lints]
workspace = true
