[package]
name = "lattice-ui-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lattice-protocol = { path = "../lattice-protocol" }
lattice-mode = { path = "../lattice-mode" }
lattice-core = { path = "../lattice-core" }
lattice-grammar = { path = "../lattice-grammar" }
lattice-completion = { path = "../lattice-completion" }
lattice-picker = { path = "../lattice-picker" }
lattice-config = { path = "../lattice-config" }
lattice-snippet = { path = "../lattice-snippet" }
lattice-syntax = { path = "../lattice-syntax" }
lattice-runtime = { path = "../lattice-runtime" }
# msg-mode.1: `set_message` routes through `tracing::event!`.
# The `MessagesLayer` subscriber lives in `lattice-runtime`;
# this crate just emits.
tracing = { workspace = true }
lattice-lsp = { path = "../lattice-lsp" }
lattice-help = { path = "../lattice-help" }
lattice-oil = { path = "../lattice-oil" }
lattice-file-tree = { path = "../lattice-file-tree" }
# T2 substrate swap (2026-05-25): terminal-cell color +
# attribute types (`TerminalColor`, `NamedColor`, `CellAttrs`)
# pattern-matched by `draw_terminal_pane` to translate the
# alacritty-published snapshot into ratatui `Color` / `Modifier`.
lattice-terminal = { path = "../lattice-terminal" }
# Phase 5.1: dep declared, unused. Phase 5.2 begins migrating
# renderer-agnostic modules out of this crate and into
# `lattice-host`; this dep is what makes those moves a single
# import change in downstream consumers (they keep importing
# from `lattice_ui_tui::*` while the crate re-exports from
# lattice-host). See docs/dev/architecture/phase-5-extraction.md.
lattice-host = { path = "../lattice-host" }
# S3.b (2026-05-26): cell-grid substrate. The
# `cells_render` module converts `lattice_cells::Cell` payloads
# into ratatui spans for the TUI body. See
# `docs/dev/architecture/cell-grid-renderer.md`.
lattice-cells = { path = "../lattice-cells" }
# refactor #70: `lsp_types` is reached through
# `lattice_lsp::lsp_types::*` (re-exported by lattice-lsp).
# `lattice-host` re-exports `lattice-lsp` transitively; no direct
# `lsp-types` dep here either.
tokio = { workspace = true }
tree-sitter = { workspace = true }
streaming-iterator = { workspace = true }
fancy-regex = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
arc-swap = { workspace = true }
# `register_event!` expands to a `#[linkme::distributed_slice]`
# entry; caller crates that invoke the macro must declare
# linkme as a direct dep (lattice-protocol re-exports the
# attribute macro but the path lookup still resolves through
# the caller's manifest).
linkme = { workspace = true }
unicode-width = "0.2"
anyhow = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
# 4.4.l.2: cross-platform fs watcher driving the LSP
# `workspace/didChangeWatchedFiles` fan-out.
notify = { workspace = true }
# CB.2 (docs/dev/architecture/clipboard.md): native OS clipboard, gated
# behind the `system-clipboard` feature (X11/Wayland link libs on Linux;
# see the `[features]` block below).
arboard = { workspace = true, optional = true }
# CB.2: OSC52 clipboard-write escape sequences are base64-encoded. No
# system-lib dependency, always compiled in.
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "test-util", "time"] }
criterion = { workspace = true }

[features]
default = []
# CB.2: real OS clipboard support (macOS / X11 / Wayland / Windows) via
# `arboard`. Off by default so `cargo test --workspace` and `cargo build -p
# lattice-cli` stay headless-friendly (no display-system libs required at
# link time on Linux: `libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev`
# for X11, `libwayland-dev` for Wayland) -- mirrors `lattice-ui-gpui`'s
# `window` feature. Without this feature, yank still reaches the real
# system clipboard via the OSC52 write fallback (no link deps); only
# clipboard *read* (paste-from-another-app) needs this feature enabled.
system-clipboard = ["dep:arboard"]

[[bench]]
name = "folds"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "keymap"
harness = false

[lints]
workspace = true
