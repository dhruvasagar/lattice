[package]
name = "lattice-vcs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# VCS.1: pure git data layer for the magit feature.
# Wraps `gix` for read + write git operations — repository discovery,
# blob reads, ref resolution, working-tree status, index staging,
# commit creation, branch manipulation, stash operations.
# Zero `lattice-*` deps; only `gix`, `ropey`, `smallvec`, `thiserror`.
# Consumed by `lattice-host::vcs` (Layer 2 auto-inline-diff subsystem)
# and `lattice-magit` (Layer 3 buffer modes).
# See `docs/dev/architecture/magit.md` §3.1 and
# `docs/dev/operations/slice-plans/magit.md` VCS.1.

[lib]
# Build-time: this crate has no doc examples, and `cargo test -p <crate>`
# still compiles + links a doctest binary for it regardless. Measured at
# ~100s of "merged doctests compilation" on a comparable crate, paid on
# every test invocation. Turn it back on the moment a `///  ```rust`
# example lands here — the point is to stop paying for nothing, not to
# discourage examples.
doctest = false

[dependencies]
gix = { workspace = true, features = ["blob-diff"] }
ropey = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
insta = { workspace = true }

[[bench]]
name = "status"
harness = false

[lints]
workspace = true
