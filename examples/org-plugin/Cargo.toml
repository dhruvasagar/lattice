# The reference org language plugin (LG.4).
#
# NOT a workspace member and NOT built by `cargo build`. It lives here as
# version-controlled reference source — the thing a user's plugin manager
# clones and builds on boot (PM.5–PM.8), and the shape a real language plugin
# takes. Its `queries/highlights.scm` IS under test, by
# `crates/lattice-syntax/tests/org_headlines.rs`, so the reference cannot rot
# into something that does not compile.
#
# Standalone workspace so it targets wasm32-wasip2 without inheriting the host
# toolchain's lints or target, exactly like the test fixtures.
[package]
name = "org-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"

[profile.release]
opt-level = "s"
strip = true

[workspace]
