# AP.1 — the `auto-pair` bundled plugin. A real `wasm32-wasip2` guest providing
# THREE seams from one component (grammar + modes + config): the pairing actions,
# the `auto-pair-mode` minor mode that owns their insert-mode keymap, and the
# `auto-pair.style` / `auto-pair.close-key` options. The first BUNDLED plugin —
# it de-risks the multi-seam packaging/load pipeline (AP.1.0 proved instantiation)
# before the heavier `lighthouse`.
#
# Standalone workspace (`[workspace]` below): targets wasm32-wasip2, must not
# inherit the host toolchain's lints/target, and must not be built by a plain
# `cargo build --workspace`. Built to a component by
# `crates/lattice-plugin-host/build.rs` (the `build_guest` path) → `AUTO_PAIR_WASM`.
[package]
name = "auto-pair"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"

[profile.release]
opt-level = "s"
strip = true

[workspace]
