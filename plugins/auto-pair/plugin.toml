# AP.1 — the auto-pair plugin manifest. Bundled (pre-granted), NO capabilities:
# it reaches no filesystem, network, or subprocess — it only reads buffer text
# through the grammar `borrow<document>` handle and contributes grammar / modes /
# config registry entries. `grammar` MUST precede `modes` in `provides`: the
# mode's keymap binds to the plugin's OWN grammar actions by name, resolved
# against the command registry at bind time, so the grammar drain must run first.
id = "auto-pair"
provides = ["grammar", "modes", "config"]
