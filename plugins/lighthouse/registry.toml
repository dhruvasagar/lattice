# typescript-language-server drives TypeScript's `tsserver`, so it is
# installed beside a pinned TypeScript 6 (7 is the native port, with no
# tsserver API). 5.3 rather than 6.x: 6.0 requires Node >= 22.22.2, and its
# only breaking change is that requirement. The server is told
# `typescriptreact` / `javascript` / `javascriptreact` per file by the editor.
[[server]]
name = "typescript-language-server"
lsp-id = "typescript"
language-id = "typescript"
version = "5.3.0+ts.6.0.3"
args = ["--stdio"]
file-patterns = ["*.ts", "*.tsx", "*.js", "*.jsx", "*.mts", "*.cts"]
root-markers = ["tsconfig.json", "jsconfig.json", "package.json", ".git"]

[server.recipe]
command = "npm"
args = [
    "install", "--prefix", "{dir}", "--no-save", "--no-fund", "--no-audit",
    "--no-update-notifier", "--ignore-scripts", "--loglevel=warn",
    "typescript-language-server@5.3.0", "typescript@6.0.3",
]
binary = "node_modules/.bin/typescript-language-server"
