# The servers lighthouse can install. Compiled into the plugin.
#
# Adding a server is an edit here and nothing else — plus, if it downloads
# from a host not already listed, a `net:http:<host>` line in `plugin.toml`.
#
# Per server:
#   name           what `:lsp-install <name>` takes, and the install directory
#   lsp-id         the editor's id for this language's server. Installing
#                  SHADOWS the built-in config with the same id, so the
#                  managed binary replaces the `PATH` lookup instead of
#                  running beside it. Match `lattice-lsp`'s defaults.
#   language-id    the LSP `languageId` sent on `didOpen`
#   version        the pinned release. An update is a new pin.
#   args           passed to the server verbatim
#   file-patterns  which files start it
#   root-markers   how its workspace root is found
#
# Per platform, keyed `<os>-<arch>` as the editor reports them (`linux`,
# `macos`, `windows`; `x86_64`, `aarch64`):
#   url            https only
#   sha256         of the file at `url`. MANDATORY, and checked by the host as
#                  the bytes arrive: a mismatch installs nothing.
#   archive        `gz` (one compressed file), `tar-gz`, or `none` (the
#                  download is the executable itself)
#   binary         the server executable, relative to the unpacked tree. For
#                  `gz` and `none` it is the name the single file is given.
#
# The digests below are the ones GitHub publishes for each release asset;
# linux-x86_64 was also downloaded and hashed when it was pinned.
#
# A server with no pre-built download has a `[server.recipe]` instead of
# platforms — its package manager, run in the install directory:
#   command        a bare program name, found on `PATH` (no shell)
#   args           passed verbatim; `{dir}` is the install directory
#   binary         what the command leaves behind, relative to that directory
# Pin exact versions in `args`: the package manager checks what it fetched
# (npm's integrity hashes, Go's checksum database), and an exact pin is what
# makes that check mean "the release we tested". npm runs with
# `--ignore-scripts`, so no dependency's install script runs. Recipes run on
# Linux and macOS.

[[server]]
name = "rust-analyzer"
lsp-id = "rust"
language-id = "rust"
version = "2026-10-05"
args = []
file-patterns = ["*.rs"]
root-markers = ["Cargo.toml", "rust-project.json", ".git"]

[server.platform.linux-x86_64]
url = "https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-05/rust-analyzer-x86_64-unknown-linux-gnu.gz"
sha256 = "28070188df63b6f217768040781decc8db43bc9d29b126847acb365575b09bc9"
archive = "gz"
binary = "rust-analyzer"

[server.platform.linux-aarch64]
url = "https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-05/rust-analyzer-aarch64-unknown-linux-gnu.gz"
sha256 = "3974c863acbbd96ef2cc02a7aaa79123935b05f27ffe4fd393fc229522f75cb9"
archive = "gz"
binary = "rust-analyzer"

[server.platform.macos-x86_64]
