base_url = "https://dhruvasagar.github.io/lattice"
title = "Lattice"
description = "A modal, GPU-accelerated, plugin-first text editor in Rust"

output_dir = "public"
compile_sass = true
minify_html = true
generate_feeds = false
build_search_index = true
taxonomies = []

[extra]
github_repo = "https://github.com/dhruvasagar/lattice"
# The community chat invite. One place, because an invite can be rotated and
# the footer must not be the copy that gets forgotten. README.md,
# CONTRIBUTING.md, site/content/faq.md and .github/ISSUE_TEMPLATE/config.yml
# carry the same URL and cannot read this value — change all five together.
discord_invite = "https://discord.gg/rqbeVSBBY"
tagline = "Combines vim's modal editing power with emacs's extensibility model on a non-blocking, multi-threaded core."
# GitHub Actions dispatcher for the docs deploy workflow.
deploy_ref = "https://github.com/dhruvasagar/lattice/actions/workflows/deploy-docs.yml"
