# Website navigation manifest for the DEVELOPER docs.
#
# `docs/dev/` is organised by *kind* — architecture / guides / operations /
# audit / notes — because that is what the repo needs: a design fragment and a
# slice plan are different artefacts with different lifetimes (CLAUDE.md, "Doc
# organisation"). That shape is right for contributors editing files and wrong
# for a website, where 95 alphabetised architecture pages present a newcomer
# with `acp-ux-enhancements` first and no hint that `design.md` is the spine.
#
# This file is the site's navigation layer over that corpus, exactly as
# `nav.toml` is for the user docs. It decides three things and nothing else:
#
#   * which section a page lands in  (-> its URL, /dev/<slug>/<page>/)
#   * what order pages appear in     (-> sidebar + section landing order)
#   * what the sidebar calls it      (-> [labels], only where the doc's own H1
#                                       reads badly out of context)
#
# `site/scripts/sync-docs.sh` reads this file and FAILS if a page under
# `docs/dev/` is missing here, or if an entry here names a page that does not
# exist. That is the whole point: the reason `nav.toml` has not rotted is that
# forgetting it breaks the build, and a manifest without that property is just
# a second thing to forget.
#
# Entries are `<subdir>/<stem>` — the same key the sync uses internally — so a
# section can mix architecture, guides and operations pages. Onboarding does
# not care which directory a doc lives in; it cares what question the doc
# answers.

# ---------------------------------------------------------------------------
# The onboarding path. Deliberately short: five pages, in reading order.
# ---------------------------------------------------------------------------

[[section]]
