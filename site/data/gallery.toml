# The landing-page differentiator gallery.
#
# EMPTY ON PURPOSE. `shots = []` renders nothing at all — no heading, no grid,
# no empty shelf — so this file can ship before the captures do. The same rule
# the plugin index follows for its unpopulated "community" group: a broken
# image is worse than an absent one, so nothing is referenced until the file
# exists.
#
# Add an entry per shot as it lands. `crates/lattice-cli/tests/`'s
# `every_referenced_screenshot_exists` reads this file and fails if a `file`
# here is missing from EITHER location it has to live in:
#
#   * assets/media/screenshots/<file>  — what README.md references
#   * site/static/media/<file>         — what the site serves
#
# Nothing mirrors those directories automatically. Copy to both.
#
# Fields:
#   file     the basename, present in both directories above
#   alt      the accessible description — what is on screen, not the slogan
#   title    the card heading, a claim rather than a feature name
#   blurb    one sentence: what it shows and who cannot do it
#
# Capture conventions, per-shot setup and the destination of each file are in
# docs/media/screenshot-ideas.md. Order here is the order on the page, and the
# intended order is the differentiator order from
# docs/dev/architecture/launch-0.9.md §10.

shots = []

