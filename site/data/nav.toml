# Website navigation manifest for the user docs.
#
# `docs/user/*.md` is deliberately FLAT — it is the offline `:help` corpus
# embedded in the binary, where `:help <topic>` resolves a bare topic name.
# That shape is right for `:help` and wrong for a website, which needs a
# reading order and progressive disclosure.
#
# This file is the site's navigation layer over that flat corpus. It decides
# three things and nothing else:
#
#   * which section a topic lands in  (-> its URL, /docs/<slug>/<topic>/)
#   * what order topics appear in     (-> sidebar + section landing order)
#   * what the sidebar calls it       (-> [labels], only where the doc's own
#                                         H1 reads badly out of context)
#
# `site/scripts/sync-docs.sh` reads this file, routes each doc to its section,
# and resolves every `help:<topic>` cross-link to the topic's new path. The
# sync FAILS if a doc in docs/user/ is missing here, or if an entry here names
# a doc that does not exist — so this file cannot silently rot the way the
# hand-maintained topic table in content/docs/_index.md did.
#
# Two tiers, and the distinction is load-bearing:
#
#   GUIDE sections (start..config) hold topics you read to learn a capability.
#   They carry the main sidebar.
#
#   REFERENCE holds per-surface keymap tables — one buffer kind, one minor
#   mode, one language grammar. You arrive by search or cross-link, not by
#   browsing. 74 of the 113 topics live here; keeping them out of the main
#   sidebar is the single biggest readability win in this layout.

