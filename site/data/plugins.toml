# The plugin index. One entry per plugin the website lists.
#
# This file carries only what a plugin cannot tell us about itself: which group
# it belongs to on /plugins/, where it sorts, and the one-line blurb its card
# shows. Everything else on a plugin's page is DERIVED —
#
#   * bundled plugins: the body is `plugins/<id>/doc/<id>.md`, the same markdown
#     `:help <id>` serves inside the editor, so the website cannot drift from
#     the manual the editor ships;
#   * the "Getting it" block is read out of `plugins/<id>/plugin.toml` — the
#     enable gate from `default_mode(s)`, the seams from `provides`, the grants
#     from `capabilities` / `editor_capabilities`;
#   * external plugins live in someone else's repository, so there is nothing
#     in-tree to sync. Their body is authored at `site/data/plugin-pages/<id>.md`
#     and `body = "authored"` says so.
#
# EVERYTHING under site/content/plugins/ except `_index.md` is generated by
# site/scripts/sync-docs.sh. Do not hand-edit a page there; edit the plugin's
# own doc/, or the authored body beside this file.
#
# `kind = "bundled"` is checked against CORE_PLUGINS in xtask/src/main.rs in
# both directions, so this file cannot quietly disagree with what ships.

[[plugin]]
id = "auto-pair"
kind = "bundled"
weight = 10
description = "Closes brackets and quotes as you type, and closes the nearest unmatched opener on one key."

[[plugin]]
id = "treesitter-context"
kind = "bundled"
weight = 11
description = "Pins the enclosing function, impl or branch above the text once its header scrolls off."

[[plugin]]
id = "project"
kind = "bundled"
weight = 12
description = "Choose the project first, then the verb — find a file, grep, open a shell or Magit in a project you are not currently in."

[[plugin]]
id = "org"
kind = "external"
weight = 20
body = "authored"
repo = "https://github.com/dhruvasagar/lattice-org-plugin"
description = "Org-mode as a WebAssembly component — outline, TODO workflow, agenda, capture, roam and clocking. Also the reference for writing your own plugin."
